/* ---------- dates & cycles ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function cycleStart(card,dateStr){
  const d=parseD(dateStr); const sd=card.cycle==='statement'?Math.min(Math.max(1,+card.stmtDay||1),28):1;
  let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()<sd){ m--; if(m<0){m=11;y--;} }
  return y+'-'+pad(m+1)+'-'+pad(sd);
}
function cycleEnd(card,dateStr){const s=parseD(cycleStart(card,dateStr)); const e=new Date(s.getFullYear(),s.getMonth()+1,s.getDate()-1); return ymd(e);}

/* ---------- pools ---------- */
function allPools(cards){const p={}; cards.forEach(c=>Object.entries(c.pools||{}).forEach(([id,v])=>p[id]={...v,id,owner:c.id})); return p;}
function poolCycleCard(cards,poolId){const P=allPools(cards); return cards.find(c=>c.id===(P[poolId]||{}).owner);}

/* ---------- rule matching ---------- */
function ladyCats(card){ const o=card.options||{}; return o.ladyCats||[o.ladyCat||'dining']; }
function ruleCats(rule,card){ if(rule.cats==='all') return 'all'; return rule.cats.map(x=>x==='@ladyCat'?ladyCats(card)[0]:x==='@lady0'?ladyCats(card)[0]:x==='@lady1'?ladyCats(card)[1]:x).filter(Boolean); }
function payOf(tx){ if(tx.channel!=='instore') return null; if(tx.pay) return tx.pay; return tx.wallet===false?'tap':'wallet'; }
const PAYNAME={wallet:'phone/watch tap',tap:'physical card tap',chip:'chip/swipe'};
/* returns {ok:true} or {ok:false, near:bool, reason} ; near = the category matched so the reason is a real "gotcha" */
function ruleCheck(rule,card,tx){
  const cat=tx.cat; const fcy=!!tx.fcy||cat==='fcy'; const no=(reason,near=true)=>({ok:false,near,reason});
  if(rule.requires && !((card.options||{})[rule.requires])) return no('condition not met',false);
  const cats=ruleCats(rule,card);
  if(rule.merchant){ let m=false; try{m=new RegExp(rule.merchant,'i').test(tx.merchant||'');}catch(e){} if(!m) return no('merchant-specific',false); }
  else if(cats!=='all' && !cats.includes(cat)) return no('no bonus for this category',false);
  if(NOBONUS_CATS.includes(cat)) return no('rent/loan/tax/transfer-type payments usually get no bonus (often excluded MCCs)',false);
  if((cat==='bills'||cat==='insurance') && !rule.allowBills) return no(cat==='bills'?'bills/utilities get no bonus':'insurance gets no bonus',false);
  if(rule.excl && rule.excl.includes(cat)) return no((rule.exclWhy||{})[cat]||'category excluded');
  if(rule.until && tx.date>rule.until) return no('promo ended');
  if(rule.fcy==='fcy' && !fcy) return no('needs foreign-currency spend',cats!=='all');
  if(rule.fcy==='sgd' && fcy) return no('SGD only',cats!=='all');
  if(rule.sea && !tx.sea) return no('only IDR/MYR/THB/VND',false);
  if(rule.channel==='online' && tx.channel!=='online') return no('online/in-app only');
  if(rule.channel==='instore' && tx.channel!=='instore') return no('in-store only');
  const pay=payOf(tx);
  if(tx.channel==='instore' && rule.pay==='wallet' && pay!=='wallet') return no(`needs Apple/Google/Samsung Pay tap - ${PAYNAME[pay]} earns base only`);
  if(tx.channel==='instore' && rule.pay==='contactless' && pay==='chip') return no('needs contactless (tap) - chip/swipe earns base only');
  if(rule.noInApp && tx.channel==='online' && tx.inApp) return no('in-app Apple/Google Pay is excluded - pay with the card details instead');
  if(rule.catNot && rule.catNot[cat]){ try{ if(new RegExp(rule.catNot[cat].re,'i').test(tx.merchant||'')) return no(rule.catNot[cat].why); }catch(e){} }
  if(rule.notMerchant){ try{ if(new RegExp(rule.notMerchant,'i').test(tx.merchant||'')) return no(rule.notWhy||'merchant excluded'); }catch(e){} }
  return {ok:true};
}
function ruleLabel(r,card){ const m={'@lady0':0,'@lady1':1}; if(Array.isArray(r.cats)&&m[r.cats[0]]!==undefined){const c=CAT[ladyCats(card)[m[r.cats[0]]]]; return "Lady's bonus: "+(c?c.name:'?');} return r.label; }
function ruleMatches(rule,card,tx){ return ruleCheck(rule,card,tx).ok; }
function baseRate(card,tx){ const fcy=!!tx.fcy||tx.cat==='fcy';
  if((card.catRates||{})[tx.cat]!==undefined) return card.catRates[tx.cat];
  if((card.zeroCats||[]).includes(tx.cat)) return 0;
  return fcy?card.baseFcy:card.baseLocal; }

/* usage: { "<poolId>|<cycleStart>": amountUsed } ; minOK(card,tx,poolId)->bool */
function zeroAlloc(reason){ return {spec:99,miles:0,parts:[],delta:{},bonusAmt:0,blockedByMin:null,capHit:null,matched:false,base:0,status:'ineligible',reason,kf:1,fee:0}; }
function allocate(card,tx,usage,cards,minOK){
  const vr=viaRule(card,tx.via);
  if(vr){
    if(vr.zero) return zeroAlloc(vr.why);
    if(vr.as){ const alt=cards.find(c=>c.id===vr.as)||DEFAULT_CARDS.find(c=>c.id===vr.as); if(alt) return allocate(alt,{...tx,via:null},usage,cards,minOK); }
    if(vr.channel||vr.inApp) tx={...tx,channel:vr.channel||tx.channel,inApp:vr.inApp!==undefined?vr.inApp:tx.inApp};
    if(vr.base){ const r=allocate({...card,rules:[]},{...tx,via:null},usage,cards,minOK); r.reason=vr.why; r.verify=!!vr.verify; return r; }
    if(vr.verify){ const r=allocate(card,{...tx,via:null},usage,cards,minOK); r.verify=true; if(r.miles>0) r.reason=(r.reason?r.reason+'; ':'')+'unverified: '+vr.why; return r; }
  }
  const blk=+card.block||1; const amt=+tx.amount||0; const blockAmt=Math.floor((amt+1e-9)/blk)*blk;
  const base=baseRate(card,tx); const kf=(KF_MODE&&card.kfFactor)?card.kfFactor:1;
  const checks=(card.rules||[]).map(r=>({r,c:ruleCheck(r,card,tx)}));
  const rules=checks.filter(x=>x.c.ok).map(x=>x.r).sort((a,b)=>b.mpd-a.mpd);
  const near=checks.find(x=>!x.c.ok&&x.c.near);
  // bonus portion drawn from exact amount if bank aggregates bonus monthly, else from block-rounded amount
  let left=card.aggBonus?amt:blockAmt; const parts=[]; const delta={};
  const P=allPools(cards); let blockedByMin=null, capHit=null;
  for(const r of rules){ if(left<=0) break;
    const minPools=(r.pools||[]).filter(p=>P[p]&&P[p].min);
    if((card.min && !minOK(card,tx,null)) || minPools.some(p=>!minOK(card,tx,p))){ blockedByMin=blockedByMin||{rule:r,min:card.min||P[minPools[0]].min}; continue; }
    let room=Infinity; const keys=[];
    for(const p of (r.pools||[])){ if(!P[p]) continue; const pc=poolCycleCard(cards,p)||card; const k=p+'|'+cycleStart(pc,tx.date); keys.push(k);
      room=Math.min(room, Math.max(0,P[p].cap-(usage[k]||0)-(delta[k]||0))); }
    const take=Math.min(left,room);
    if(take<left && !capHit) capHit={rule:r,room:Math.max(0,room)};
    if(take<=0) continue;
    keys.forEach(k=>delta[k]=(delta[k]||0)+take);
    const rc=ruleCats(r,card); const spec=rc==='all'?CATS.length-(r.excl||[]).length:Math.max(1,rc.length);
    parts.push({amt:take,mpd:r.mpd,label:ruleLabel(r,card),spec}); left-=take;
  }
  let miles;
  if(card.aggBonus){ // base on whole (block-rounded) amount + bonus uplift on bonus portion
    const bonusAmt=parts.reduce((s,p)=>s+p.amt,0);
    miles=blockAmt*base+parts.reduce((s,p)=>s+p.amt*(p.mpd-base),0);
    const baseLeft=Math.max(0,blockAmt-bonusAmt); if(baseLeft>0) parts.push({amt:+baseLeft.toFixed(2),mpd:base,label:'Base rate'});
  } else { if(left>0) parts.push({amt:left,mpd:base,label:'Base rate'}); miles=parts.reduce((s,p)=>s+p.amt*p.mpd,0); }
  miles*=kf;
  const bonusAmt=parts.filter(p=>p.label!=='Base rate').reduce((s,p)=>s+p.amt,0);
  const spec=Math.min(99,...parts.filter(p=>p.spec).map(p=>p.spec));
  // status for gating UI
  let status='base', reason=null;
  const capName=h=>{ if(!h) return 'bonus'; const pid=(h.rule.pools||[])[0]; const P=allPools(cards)[pid]; const lab=/^@lady/.test((h.rule.cats||[])[0]||'')?ruleLabel(h.rule,card):(P&&P.name)||ruleLabel(h.rule,card); return `${lab} S$${fmt(P?P.cap:0)}/${card.cycle==='statement'?'stmt':'cal'} month`; };
  if(bonusAmt>0 && bonusAmt>=amt-blk+1e-9 && !capHit) status='bonus';
  else if(bonusAmt>0) { status='partial'; reason=`only S$${fmt(bonusAmt)} left in cap (${capName(capHit)}) - rest at ${base} mpd`; }
  else if(capHit && capHit.room<=0) { status='capped'; reason=`Cap reached (${capName(capHit)})`; }
  else if(blockedByMin) { status='minspend'; reason=`Min spend S$${fmt(blockedByMin.min)} not met yet - bonus not counted`; }
  else if(near) { status='ineligible'; reason=near.c.reason; }
  if(base===0 && bonusAmt===0) { status='ineligible'; reason=reason||(tx.cat==='insurance'?'insurance earns no points':'excluded - earns no points'); }
  return {spec,miles:Math.floor(miles+1e-9),parts,delta,bonusAmt,blockedByMin,capHit,matched:rules.length>0,base:+(base*kf).toFixed(2),status,reason,kf,
    fee:(card.feeSgdPct&&!(tx.fcy||tx.cat==='fcy'))?Math.max(0.5,amt*card.feeSgdPct/100):0};
}

/* spend totals for min-spend: card-level (all spend on card in cycle) and pool-level (spend matching rules of that pool) */
function spendTotals(state,excludeId){
  const T={};
  for(const tx of state.txs){ if(tx.id===excludeId || !isCardTx(tx)) continue; const card=state.cards.find(c=>c.id===tx.card); if(!card) continue;
    const k='card:'+card.id+'|'+cycleStart(card,tx.date); T[k]=(T[k]||0)+(+tx.amount);
    const P=allPools(state.cards);
    const seen=new Set();
    (card.rules||[]).forEach(r=>{ if(ruleMatches(r,card,tx)) (r.pools||[]).forEach(p=>{ if(P[p]&&P[p].min&&!seen.has(p)){seen.add(p); const kk='pool:'+p+'|'+cycleStart(card,tx.date); T[kk]=(T[kk]||0)+(+tx.amount);} }); });
  }
  return T;
}
function poolMinFor(cards,p){const P=allPools(cards);return P[p]?P[p].min:0;}

/* Ledger: chronological evaluation of logged transactions (actual min-spend status at cycle end) */
function evalLedger(state){
  const totals=spendTotals(state);
  const minActual=(card,tx,p)=>{ if(p===null) return (totals['card:'+card.id+'|'+cycleStart(card,tx.date)]||0)>=card.min;
     return (totals['pool:'+p+'|'+cycleStart(card,tx.date)]||0)>=poolMinFor(state.cards,p); };
  const usage={}; const res={};
  const txs=[...state.txs].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  for(const tx of txs){
    if(!isCardTx(tx)){ res[tx.id]={miles:0,parts:[],nonCard:true,missed:0,optimal:null,optimalMiles:0}; continue; }
    const card=state.cards.find(c=>c.id===tx.card);
    if(!card){res[tx.id]={miles:0,parts:[],err:'Card not found'};continue;}
    const r=allocate(card,tx,usage,state.cards,minActual);
    // optimal among held cards (optimistic: assume their min spend met if assumeMin)
    let best={card:card,miles:r.miles};
    for(const c of state.cards.filter(c=>c.held && c.id!==card.id)){
      const a=allocate(c,tx,usage,state.cards,(cc,t,p)=>p===null?(cc.assumeMin!==false):true);
      if(a.miles>best.miles) best={card:c,miles:a.miles};
    }
    Object.entries(r.delta).forEach(([k,v])=>usage[k]=(usage[k]||0)+v);
    res[tx.id]={...r,optimal:best.card.id,optimalMiles:best.miles,missed:Math.max(0,best.miles-r.miles),
      pendingMin: !!r.blockedByMin};
  }
  return {res,usage,totals};
}

/* usage from all logged txs (optionally excluding one) */
function currentUsage(state,excludeId){ const s={...state,txs:state.txs.filter(t=>t.id!==excludeId)}; return evalLedger(s); }

/* Ranking: most miles; ties -> no extra fee, then most specialised bonus (save flexible caps), then most cap room */
function rankCmp(a,b){ return (b.miles-a.miles) || ((!!a.verify)-(!!b.verify)) || ((a.fee>0)-(b.fee>0)) || (a.spec-b.spec) || (b.bonusAmt-a.bonusAmt); }
/* Recommendation for a draft transaction */
function shortName(n){return n.replace(/\s*\(.*?\)\s*/g,' ').trim();}
function recommend(state,draft,excludeId){
  const L=currentUsage(state,excludeId);
  const minProj=(card,tx,p)=>{
    if(p===null){ if(card.assumeMin!==false) return true; return ((L.totals['card:'+card.id+'|'+cycleStart(card,tx.date)]||0)+(+tx.amount))>=card.min; }
    if(card.assumeMin!==false) return true;
    return ((L.totals['pool:'+p+'|'+cycleStart(card,tx.date)]||0)+(+tx.amount))>=poolMinFor(state.cards,p);
  };
  const held=state.cards.filter(c=>c.held);
  const list=held.map(c=>{const a=allocate(c,draft,L.usage,state.cards,minProj); return {card:c,...a,mpd:draft.amount>0?a.miles/draft.amount:0};})
    .sort(rankCmp);
  const out={list,msg:null,split:null};
  if(!list.length) return out;
  const top=list[0];
  // Which card would win if all caps were fresh? Explain why it's not chosen now.
  const msgs=[];
  const fresh=held.map(c=>({c,a:allocate(c,draft,{},state.cards,minProj)}));
  const blocked=fresh.filter(f=>f.c.id!==top.card.id && f.a.miles>=top.miles).map(f=>({f,r:list.find(x=>x.card.id===f.c.id)}))
    .filter(x=>x.r && (x.r.status==='capped'||x.r.status==='partial') && x.r.miles<x.f.a.miles);
  if(blocked.length){
    msgs.push(blocked.map(x=>`${shortName(x.f.c.name)}: ${x.r.reason}`).join('. ')+`. Best now: ${shortName(top.card.name)}.`); out.blocked=blocked.map(x=>x.f.c.id);
  } else if(top.status==='partial'){
    msgs.push(`${top.card.name}: ${top.reason}.`);
  }
  const ideal=fresh.sort((x,y)=>rankCmp(x.a,y.a))[0];
  // Split suggestion: put remaining cap room on card A, rest on best other card
  let bestSplit=null;
  for(const x of list){
    if(!(x.bonusAmt>0 && x.bonusAmt<draft.amount)) continue;
    const partA=allocate(x.card,{...draft,amount:x.bonusAmt},L.usage,state.cards,minProj);
    const u2={...L.usage}; Object.entries(partA.delta).forEach(([k,v])=>u2[k]=(u2[k]||0)+v);
    const rest={...draft,amount:+(draft.amount-x.bonusAmt).toFixed(2)};
    const ob=held.filter(c=>c.id!==x.card.id).map(c=>({c,a:allocate(c,rest,u2,state.cards,minProj)})).sort((p,q)=>q.a.miles-p.a.miles)[0];
    if(!ob) continue; const tot=partA.miles+ob.a.miles;
    if(tot>top.miles && (!bestSplit||tot>bestSplit.miles)) bestSplit={a:x.card,amtA:x.bonusAmt,milesA:partA.miles,b:ob.c,amtB:rest.amount,milesB:ob.a.miles,miles:tot};
  }
  if(bestSplit){ out.split=bestSplit; msgs.push(`If the merchant lets you split: S$${fmt(bestSplit.amtA)} on ${shortName(bestSplit.a.name)} + S$${fmt(bestSplit.amtB)} on ${shortName(bestSplit.b.name)} = ${bestSplit.miles.toLocaleString('en-SG')} miles.`); }
  out.msg=msgs.join(' ')||null;
  return out;
}

/* Pool status for a reference date */
function poolStatus(state,refDate){
  const L=evalLedger(state); const P=allPools(state.cards); const out=[];
  for(const [pid,p] of Object.entries(P)){
    const owner=state.cards.find(c=>c.id===p.owner); if(!owner||!owner.held) continue;
    const cs=cycleStart(owner,refDate); const used=L.usage[pid+'|'+cs]||0;
    const minSpent=p.min?(L.totals['pool:'+pid+'|'+cs]||0):null;
    out.push({pid,name:p.name,card:owner,cap:p.cap,used,remaining:Math.max(0,p.cap-used),pct:p.cap?used/p.cap:0,cycleStart:cs,cycleEnd:cycleEnd(owner,refDate),min:p.min||0,minSpent});
  }
  return out;
}
function cardMinStatus(state,refDate){ const L=evalLedger(state);
  return state.cards.filter(c=>c.held&&c.min).map(c=>{const cs=cycleStart(c,refDate); return {card:c,min:c.min,spent:L.totals['card:'+c.id+'|'+cs]||0,cycleStart:cs};}); }

/* Cheat sheet: best card for each category and channel, S$100 purchase, given current caps */
function cheatSheet(state,date,amount){
  amount=amount||100; const rows=[];
  for(const cat of CATS.filter(c=>!c.nc)){
    const row={cat,ch:{}};
    for(const ch of ['online','instore']){
      const draft={amount,cat:cat.id,channel:ch,wallet:true,fcy:cat.id==='fcy',merchant:'',date};
      const r=recommend(state,draft); row.ch[ch]=r.list.slice(0,2).map(x=>({card:x.card,mpd:x.miles/amount,miles:x.miles,capHit:x.capHit,bonusAmt:x.bonusAmt}));
    }
    rows.push(row);
  }
  return rows;
}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('en-SG',{maximumFractionDigits:2});}


/* ===== Data model migration (in place, idempotent) ===== */
const DATA_VERSION=5;
function migrateState(s){
  s.txs=Array.isArray(s.txs)?s.txs:[];
  for(const t of s.txs){
    if(!t.src) t.src='card';
    if(t.src!=='card'){ t.card=null; }
    if(t.channel==='instore' && !t.pay && t.src==='card') t.pay=(t.wallet===false?'tap':'wallet');
    t.amount=+t.amount||0;
  }
  s.settings=s.settings||{};
  if(s.settings.kf===undefined) s.settings.kf=true;
  if(!Array.isArray(s.settings.excludeCats)) s.settings.excludeCats=['savings'];
  if(!s.settings.budgets||typeof s.settings.budgets!=='object') s.settings.budgets={};
  if(!Array.isArray(s.recurring)) s.recurring=[];
  // v4: onboarding, theme, remembered Add choices, statement-date confirmation, editable content overrides
  if(s.settings.onboarded===undefined) s.settings.onboarded=!!(s.txs.length||(Array.isArray(s.cards)&&s.cards.some(c=>c.held)));
  if(!['auto','light','dark'].includes(s.settings.theme)) s.settings.theme='auto';
  if(!s.settings.last||typeof s.settings.last!=='object') s.settings.last={};
  if(s.settings.saveHints===undefined) s.settings.saveHints=true;
  if(!s.content||typeof s.content!=='object') s.content={};
  if(Array.isArray(s.cards)) for(const c of s.cards){ if(c.cycle==='statement'&&c.stmtSet===undefined) c.stmtSet=(+c.stmtDay||1)!==1; }
  // v5: Rent -> Rental, Subscriptions category, sync metadata (updatedAt / tombstones / stamps), refreshed card reference data
  const rc=c=>c==='rent'?'rental':c;
  for(const t of s.txs){ t.cat=rc(t.cat); if(!t.updatedAt) t.updatedAt=+t.ts||0; }
  for(const r of s.recurring){ r.cat=rc(r.cat); if(!r.updatedAt) r.updatedAt=0; }
  if(s.settings.budgets.rent!==undefined){ s.settings.budgets.rental=(s.settings.budgets.rental||0)+(+s.settings.budgets.rent||0); delete s.settings.budgets.rent; }
  s.settings.excludeCats=s.settings.excludeCats.map(rc); if(s.settings.last&&s.settings.last.cat) s.settings.last.cat=rc(s.settings.last.cat);
  if(!s.settings.subsMigrated){ for(const t of s.txs){ if(['entertainment','bills','others','shopping'].includes(t.cat)&&isClearSubscription(t.merchant)) { t.cat='subscriptions'; t.updatedAt=Math.max(t.updatedAt||0,1); } }
    for(const r of s.recurring) if(['entertainment','bills','others','shopping'].includes(r.cat)&&isClearSubscription(r.merchant)) r.cat='subscriptions';
    s.settings.subsMigrated=true; }
  if(!s.tombstones||typeof s.tombstones!=='object') s.tombstones={tx:{},rec:{}}; s.tombstones.tx=s.tombstones.tx||{}; s.tombstones.rec=s.tombstones.rec||{};
  if(!s.stamps||typeof s.stamps!=='object') s.stamps={};
  if(Array.isArray(s.cards)) for(const c of s.cards){ const d=DEFAULT_CARDS.find(x=>x.id===c.id); if(!d) continue;
    c.info={...d.info,fee:(FEE_INFO[c.id]||{}).fee||d.info.fee}; // reference text only; user edits live in rules/pools
    for(const r of d.rules) if(!(c.rules||[]).some(x=>x.label===r.label)&&(/Subscriptions coded/.test(r.label))) c.rules.splice(Math.max(0,c.rules.length-1),0,clone_(r));
    if(c.id==='uob_ppv') for(const r of c.rules) if(/^Selected online/.test(r.label)&&!r.cats.includes('subscriptions')){ r.cats=[...r.cats,'subscriptions']; r.notMerchant=STREAMING+'|'+TELCO; r.label=d.rules[1].label; }
    if(c.id==='amaze_citi') for(const r of c.rules) if(r.channel==='instore'){ r.channel='any'; r.label=d.rules[0].label; } }
  s.version=DATA_VERSION;
  return s;
}

/* ===== Recurring monthly entries ===== */
function clone_(o){return JSON.parse(JSON.stringify(o));}
const CLEAR_SUBS='netflix|spotify|disney\\+|disney plus|youtube premium|apple music|apple one|icloud|prime video|amazon prime|hbo|viu|chatgpt|openai|claude|adobe|microsoft 365|office 365|canva|dropbox|notion|google one|anytime fitness|fitness first|gymm boxx|ufit|virgin active|classpass';
function isClearSubscription(m){ try{ return new RegExp(CLEAR_SUBS,'i').test(m||''); }catch(e){ return false; } }
function ymAdd(ym,k){ let [y,m]=ym.split('-').map(Number); m+=k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+pad(m); }
function dateInMonth(ym,day){ const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate(); return ym+'-'+pad(Math.min(day,last)); }
/* adds one entry per missed month (lastMonth+1 .. current month) for each active template; returns # added */
function applyRecurring(state,todayYmd){
  const cur=todayYmd.slice(0,7); let n=0;
  for(const r of state.recurring||[]){
    if(!r.active) continue;
    let ym=ymAdd(r.lastMonth,1);
    while(ym<=cur){
      const date=dateInMonth(ym,r.day);
      if(!state.txs.some(t=>t.recurId===r.id && (t.date||'').slice(0,7)===ym) && !(state.tombstones&&state.tombstones.tx&&state.tombstones.tx['r'+r.id+'_'+ym])){ // deleted-on-another-device instances stay deleted // added on first open of the month (even if its day is later in the month - edit/delete freely)
        state.txs.push({id:'r'+r.id+'_'+ym,ts:Date.now()+n,date,amount:r.amount,cat:r.cat,src:r.src,card:r.src==='card'?r.card:null,
          channel:r.channel||'online',pay:r.pay,merchant:r.merchant||'',fcy:false,recurId:r.id,auto:true});
        n++;
      }
      r.lastMonth=ym; ym=ymAdd(ym,1);
    }
  }
  return n;
}

/* ===== Expense summary across all payment sources ===== */
function srcKey(t){ return isCardTx(t)?'card:'+(t.card||'?'):t.src; }
function monthTotals(state,ym){
  const ex=new Set(state.settings&&state.settings.excludeCats||[]);
  const o={total:0,excluded:0,byCat:{},bySrc:{},count:0,excludedByCat:{}};
  for(const t of state.txs){ if(t.date.slice(0,7)!==ym) continue; const a=+t.amount||0;
    if(ex.has(t.cat)){ o.excluded+=a; o.excludedByCat[t.cat]=(o.excludedByCat[t.cat]||0)+a; continue; }
    o.total+=a; o.count++; o.byCat[t.cat]=(o.byCat[t.cat]||0)+a; const k=srcKey(t); o.bySrc[k]=(o.bySrc[k]||0)+a; }
  return o;
}
function expenseSummary(state,ym){
  const cur=monthTotals(state,ym), prev=monthTotals(state,ymAdd(ym,-1));
  const budgets=(state.settings&&state.settings.budgets)||{};
  const cats=[...new Set([...Object.keys(cur.byCat),...Object.keys(prev.byCat),...Object.keys(budgets).filter(k=>budgets[k]>0)])]
    .filter(c=>!(state.settings.excludeCats||[]).includes(c));
  const rows=cats.map(c=>{ const a=cur.byCat[c]||0, p=prev.byCat[c]||0, b=+budgets[c]||0;
    return {cat:c,amount:a,pct:cur.total?a/cur.total:0,prev:p,diff:a-p,budget:b,remaining:b?b-a:null,budgetPct:b?a/b:null}; })
    .sort((x,y)=>y.amount-x.amount||y.budget-x.budget);
  const trend=[]; for(let k=5;k>=0;k--){ const m=ymAdd(ym,-k); trend.push({ym:m,total:monthTotals(state,m).total}); }
  // miles only over card spend
  return {ym,total:cur.total,prevTotal:prev.total,excluded:cur.excluded,excludedByCat:cur.excludedByCat,count:cur.count,rows,bySrc:cur.bySrc,trend};
}
/* card-only stats for a month (effective mpd & missed ignore non-card spend) */
function cardMonthStats(state,ym,L){
  L=L||evalLedger(state); let spend=0,miles=0,missed=0;
  for(const t of state.txs){ if(t.date.slice(0,7)!==ym||!isCardTx(t)) continue; const r=L.res[t.id]||{}; spend+=+t.amount; miles+=r.miles||0; missed+=r.missed||0; }
  return {spend,miles,missed,mpd:spend?miles/spend:0};
}

  return {summary,catTrend,merchants,opportunities:opp,expense:E};
}

  todayStr=todayStr||ymd(new Date()); const out=[]; const held=state.cards.filter(c=>c.held);

  for(const p of ps){ const nm=_cardShort(p.card.name)+(ps.filter(x=>x.card.id===p.card.id).length>1?' · '+p.name:'');
    const reset=_fmtD(_nextDay(p.cycleEnd));
    if(p.min&&p.minSpent>0&&p.minSpent<p.min){ out.push({sev:2,icon:'⏳',card:p.card.id,pid:p.pid,text:`${nm}: ${_money(p.min-p.minSpent)} short of the ${_money(p.min)} minimum - bonus pending (resets ${reset}).`}); continue; }
    if(p.min&&!p.minSpent) continue; // unused min-spend bucket: stay quiet
    if(p.pct>=1) out.push({sev:2,icon:'⛔',card:p.card.id,pid:p.pid,text:`${nm}: 4 mpd cap used up until ${reset}.`,action:'miles'});
    else if(p.used>0) out.push({sev:p.pct>=0.75?2:1,icon:p.pct>=0.75?'⚠️':'✅',card:p.card.id,pid:p.pid,text:`${nm}: ${_money(p.remaining)} left at bonus rate (resets ${reset}).`,pct:p.pct});
    else out.push({sev:0,icon:'🟢',card:p.card.id,pid:p.pid,text:`${nm}: full ${_money(p.cap)} bonus cap available (resets ${reset}).`,pct:0});
  }
  for(const m of cardMinStatus(state,todayStr)) if(m.spent>0&&m.spent<m.min) out.push({sev:2,icon:'⏳',card:m.card.id,text:`${_cardShort(m.card.name)}: ${_money(m.min-m.spent)} short of the ${_money(m.min)} minimum spend.`});
  // fee month reminders (this month or next)
  const mo=+todayStr.slice(5,7); const nx=mo%12+1; const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(const c of held.filter(c=>c.feeMonth)) if(+c.feeMonth===mo||+c.feeMonth===nx) out.push({sev:2,icon:'💰',card:c.id,text:`${_cardShort(c.name)} annual fee due ${MN[c.feeMonth-1]}: call for a waiver${c.id==='citi_prestige'?' or decide whether to cancel (transfer ThankYou points first)':''}.`,action:'playbook'});
  // DBS points expiry: quarter-end reminder
  if(held.some(c=>c.id==='dbs_wwmc')&&[3,6,9,12].includes(mo)&&+todayStr.slice(8)>=15) out.push({sev:1,icon:'⌛',card:'dbs_wwmc',text:'DBS Points expire at quarter end (12-15 months after earning) - convert if you have 5,000+.'});
  // budget pace
  const ym=todayStr.slice(0,7); const dim=_daysIn(ym), day=+todayStr.slice(8); const E=expenseSummary(state,ym);
  for(const r of E.rows.filter(r=>r.budget>0)){ if(r.amount>r.budget) out.push({sev:2,icon:'🔴',text:`${CAT[r.cat].name} is ${_money(r.amount-r.budget)} over its ${_money(r.budget)} budget.`,action:'spend'});
    else if(r.budgetPct>=0.8) out.push({sev:1,icon:'🟠',text:`${CAT[r.cat].name}: ${_money(r.budget-r.amount)} of budget left for ${dim-day} more days.`,action:'spend'}); }
  // dated promos
  for(const p of PROMOS) if(todayStr>=p.from&&todayStr<=p.until&&(!p.cats||state.txs.some(t=>p.cats.includes(t.cat)&&t.date>=ymAdd(ym,-2)))) out.push({sev:0,icon:p.icon,text:p.text,src:p.src,promo:p.id});
  return out.sort((a,b)=>b.sev-a.sev);
}

/* ===== Cloud sync (private GitHub repo, contents API) - pure logic, shared by the app and tools/ledger.js =====
   Data file = same schema as the app's Export JSON. The token is NEVER part of the data. */
const SYNC_LOCAL_SETTINGS=['last','theme','onboarded','spendMode']; // device-only preferences, never synced
const TOMBSTONE_TTL_MS=365*864e5;
const sjson=o=>JSON.stringify(o===undefined?null:o);
const strip=t=>{ const {updatedAt,...r}=t||{}; return sjson(r); };
function canon(o){ // order-insensitive comparison form
  if(Array.isArray(o)){ const a=o.map(canon); return a.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null)?a.sort((x,y)=>String(x.id).localeCompare(String(y.id))):a; }
  if(o&&typeof o==='object'){ const r={}; for(const k of Object.keys(o).sort()) r[k]=canon(o[k]); return r; } return o; }
const same=(a,b)=>JSON.stringify(canon(a))===JSON.stringify(canon(b));
function byId(a){ const m=new Map(); for(const x of a||[]) if(x&&x.id!=null) m.set(String(x.id),x); return m; }

/* Compare the state as it was last saved (prev) with the state about to be saved (cur); stamp what changed. Mutates cur. */
function stampChanges(prev,cur,now){
  now=now||Date.now();
  cur.tombstones=cur.tombstones||{tx:{},rec:{}}; cur.tombstones.tx=cur.tombstones.tx||{}; cur.tombstones.rec=cur.tombstones.rec||{};
  cur.stamps=cur.stamps||{};
  let changed=0;
  const listDiff=(pa,ca,tomb)=>{
    const pm=byId(pa), cm=byId(ca);
    for(const [id,x] of cm){ const o=pm.get(id); if(!o||strip(o)!==strip(x)){ x.updatedAt=now; changed++; } else if(x.updatedAt===undefined) x.updatedAt=o.updatedAt||0; delete tomb[id]; }
    for(const id of pm.keys()) if(!cm.has(id)){ tomb[id]=now; changed++; }
  };
  if(!prev){ for(const t of cur.txs||[]) if(t.updatedAt===undefined) t.updatedAt=now; for(const r of cur.recurring||[]) if(r.updatedAt===undefined) r.updatedAt=now; return 0; }
  listDiff(prev.txs,cur.txs,cur.tombstones.tx);
  listDiff(prev.recurring,cur.recurring,cur.tombstones.rec);
  const ps=prev.settings||{}, cs=cur.settings||{};
  for(const k of new Set([...Object.keys(ps),...Object.keys(cs)])){ if(SYNC_LOCAL_SETTINGS.includes(k)) continue; if(sjson(ps[k])!==sjson(cs[k])){ cur.stamps['settings.'+k]=now; changed++; } }
  const pc=byId(prev.cards), cc=byId(cur.cards);
  for(const [id,c] of cc){ if(sjson(pc.get(id))!==sjson(c)){ cur.stamps['card.'+id]=now; changed++; } }
  if(sjson(prev.content)!==sjson(cur.content)){ cur.stamps.content=now; changed++; }
  return changed;
}
/* Treat every local setting/card as just edited - used by "Upload my phone data" so this device's settings win once. Transactions are merged, never overwritten. */
function stampAll(s,now){ now=now||Date.now(); s.stamps=s.stamps||{};
  for(const k of Object.keys(s.settings||{})) if(!SYNC_LOCAL_SETTINGS.includes(k)) s.stamps['settings.'+k]=now;
  for(const c of s.cards||[]) s.stamps['card.'+c.id]=now; if(s.content) s.stamps.content=now; return s; }

function mergeList(la,ra,tomb){
  const lm=byId(la), rm=byId(ra), out=[];
  for(const id of new Set([...lm.keys(),...rm.keys()])){
    const l=lm.get(id), r=rm.get(id); let w;
    if(l&&r) w=(r.updatedAt||0)>(l.updatedAt||0)?r:l; else w=l||r;
    if(tomb[id]!==undefined && tomb[id]>=(w.updatedAt||0)) continue; // deleted after (or at) its last edit
    out.push(JSON.parse(JSON.stringify(w)));
  }
  return out;
}
/* Merge two (already migrated) states. Transactions/recurring by id (newest updatedAt wins), deletes via tombstones,
   settings per key last-write-wins, cards per card, device-local settings stay as on `local`. Pure: returns a new state. */
function mergeStates(local,remote,now){
  now=now||Date.now();
  if(!remote) return JSON.parse(JSON.stringify(local));
  const L=JSON.parse(JSON.stringify(local)), R=JSON.parse(JSON.stringify(remote));
  const tomb={tx:{},rec:{}};
  for(const k of ['tx','rec']) for(const src of [L.tombstones,R.tombstones]) for(const [id,t] of Object.entries((src&&src[k])||{})) if(now-t<TOMBSTONE_TTL_MS) tomb[k][id]=Math.max(tomb[k][id]||0,t);
  const ls=L.stamps||{}, rs=R.stamps||{}, stamps={};
  for(const k of new Set([...Object.keys(ls),...Object.keys(rs)])) stamps[k]=Math.max(ls[k]||0,rs[k]||0);
  const out={...R,...L};
  out.version=Math.max(L.version||0,R.version||0);
  out.txs=mergeList(L.txs,R.txs,tomb.tx).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
  out.recurring=mergeList(L.recurring,R.recurring,tomb.rec);
  for(const r of out.recurring){ const o=[...(L.recurring||[]),...(R.recurring||[])].filter(x=>x.id===r.id).map(x=>x.lastMonth||'').sort().pop(); if(o&&o>(r.lastMonth||'')) r.lastMonth=o; } // never regenerate a month twice
  // settings: newer stamp wins; on a tie the cloud copy wins (it is the shared source of truth)
  const set={}, Ls=L.settings||{}, Rs=R.settings||{};
  for(const k of new Set([...Object.keys(Ls),...Object.keys(Rs)])){
    if(SYNC_LOCAL_SETTINGS.includes(k)){ if(k in Ls) set[k]=Ls[k]; continue; }
    const lt=ls['settings.'+k]||0, rt=rs['settings.'+k]||0;
    set[k]= !(k in Rs)?Ls[k] : !(k in Ls)?Rs[k] : (lt>rt?Ls[k]:Rs[k]);
  }
  out.settings=set;
  const lc=byId(L.cards), rc=byId(R.cards), cards=[];
  for(const id of new Set([...rc.keys(),...lc.keys()])){ const l=lc.get(id), r=rc.get(id);
    cards.push(!r?l:!l?r:((ls['card.'+id]||0)>(rs['card.'+id]||0)?l:r)); }
  out.cards=cards;
  if(L.content!==undefined||R.content!==undefined) out.content=(ls.content||0)>(rs.content||0)?L.content:(R.content!==undefined?R.content:L.content);
  out.tombstones=tomb; out.stamps=stamps;
  return out;
}
/* What goes into data.json: the export schema minus device-only preferences. */
function cloudView(s){ const o=JSON.parse(JSON.stringify(s)); o.settings=o.settings||{}; for(const k of SYNC_LOCAL_SETTINGS) delete o.settings[k]; return o; }

function b64encode(str){ if(typeof Buffer!=='undefined') return Buffer.from(str,'utf8').toString('base64'); return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b){ b=(b||'').replace(/\s/g,''); if(typeof Buffer!=='undefined') return Buffer.from(b,'base64').toString('utf8'); return decodeURIComponent(escape(atob(b))); }

function ghClient(cfg){

function med(a){ const s=[...a].sort((x,y)=>x-y), n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0; }
const r10=x=>Math.round(x/10)*10;
function budgetHistory(state,todayYmd,maxMonths=6){
  const curYm=todayYmd.slice(0,7), ex=new Set(); // excluded-from-totals categories (e.g. Rental) still count here: you still need a budget for them
  const months=[]; for(let k=1;k<=maxMonths;k++) months.push(ymAdd(curYm,-k));
  const txs=(state.txs||[]).filter(t=>months.includes((t.date||'').slice(0,7))&&!ex.has(t.cat)&&!['savings','loan','family','tax'].includes(t.cat));
  const withData=months.filter(m=>txs.some(t=>t.date.slice(0,7)===m));
  const catOf=c=>c==='fcy'?'travel':c==='contactless'?'others':c==='rent'?'rental':c;
  const by={}, oneOffs=[];
  const amtsByCat={}; for(const t of txs){ (amtsByCat[catOf(t.cat)]=amtsByCat[catOf(t.cat)]||[]).push(+t.amount||0); }
  const mk=m=>(m||'').toLowerCase().replace(/[^a-z]/g,'').slice(0,10);
  for(const t of txs){ const c=catOf(t.cat), a=+t.amount||0, ym=t.date.slice(0,7);
    const others=txs.filter(u=>u!==t&&catOf(u.cat)===c).map(u=>+u.amount||0); const thr=Math.max(300,3*med(others));
    const seenElse=mk(t.merchant)&&txs.some(u=>u!==t&&u.date.slice(0,7)!==ym&&mk(u.merchant)===mk(t.merchant));
    if(c!=='rental'&&a>thr&&!seenElse&&!t.recurId){ oneOffs.push(t); continue; }
    ((by[c]=by[c]||{})[ym])=((by[c]||{})[ym]||0)+a; }

}
function suggestBudgets(state,opts,todayYmd){

  const hh=Math.max(1,Math.min(10,+opts.household||1)), housing=HOUSING[opts.housing]?opts.housing:'room';
  const income=+opts.income>0?+opts.income:null;
  const H=budgetHistory(state||{txs:[]},todayYmd||ymd(new Date()));
  const w=H.months>=3?0.7:H.months>=1?0.5:0;
  const rows=[];
  const floorOf=cat=>cat==='rental'?HOUSING[housing].v[0]:BENCH[cat]?BENCH[cat][0]*(SCALE_HH.includes(cat)?Math.sqrt(hh):1):0;
  const add=(cat,bench,srcKey,note)=>{
    const h=H.cats[cat]; let amt, why;
    const benchTxt=`SG ${life} benchmark S$${fmt(Math.round(bench))}${hh>1&&SCALE_HH.includes(cat)?` (×√${hh} for ${hh} people)`:''} - ${note}`;
    if(cat==='rental'&&h&&h.median>0){ amt=h.median; why=`Your rent S$${fmt(Math.round(h.median))}/mo (history; rent is fixed by contract). ${benchTxt}`; }
    else if(h&&w>0){ amt=w*h.median+(1-w)*bench; why=`Your median S$${fmt(Math.round(h.median))}/mo over ${h.months} month${h.months>1?'s':''}${h.oneOffs?` (${h.oneOffs} one-off${h.oneOffs>1?'s':''} excluded)`:''}, blended ${Math.round(w*100)}/${Math.round((1-w)*100)} with the ${benchTxt}`; }
    else if(w>0&&!h&&FIXED.includes(cat)){ amt=bench; why=`Nothing logged here yet (often paid outside the tracker) - full ${benchTxt}`; }
    else if(w>0&&!h){ const fl=floorOf(cat); amt=Math.max(fl,(1-w)*bench); why=`No spend logged in ${H.months} month${H.months>1?'s':''} - ${amt===fl?'frugal-level floor of the':Math.round((1-w)*100)+'% of the'} ${benchTxt}`; }
    else { amt=bench; why=`No history yet - ${benchTxt}`; }
    rows.push({cat,amount:r10(amt),history:h?Math.round(h.median):null,bench:Math.round(bench),src:srcKey,why});
  };
  const hs=HOUSING[housing]; add('rental',hs.v[li],hs.src,hs.note);
  for(const [cat,b] of Object.entries(BENCH)){ const scale=SCALE_HH.includes(cat)?Math.sqrt(hh):1; add(cat,b[li]*scale,b[3],b[4]); }
  const fixed=rows.filter(r=>r.amount===0&&r.cat==='rental'); for(const f of fixed) rows.splice(rows.indexOf(f),1);

      total=rows.reduce((s,r)=>s+r.amount,0);
      if(total>cap) notes.push(`Even trimmed, spending is S$${fmt(total)} vs S$${fmt(cap)} (80% of take-home). Housing is the lever - consider a cheaper room or a flatmate.`);
      else notes.push(`Wants trimmed so you can save 20% (S$${fmt(income-cap)}).`);
    } else notes.push(`Leaves S$${fmt(income-total)} a month (${Math.round((income-total)/income*100)}% of take-home) for savings/investments - MoneySense suggests at least 20%.`);
    const needs=rows.filter(r=>['rental','groceries','transport','bills','insurance'].includes(r.cat)).reduce((s,r)=>s+r.amount,0);

  } else notes.push(`No income entered. For reference the median full-time resident earns S$5,775 gross incl. employer CPF (MOM 2025) - roughly S$${fmt(MEDIAN_TAKEHOME)} take-home (estimate); 20% of that is S$${fmt(MEDIAN_TAKEHOME*0.2)}.`);
  if(H.months) notes.push(`History: ${H.months} prior month${H.months>1?'s':''} used${H.oneOffs.length?`, ${H.oneOffs.length} one-off purchase${H.oneOffs.length>1?'s':''} ignored (e.g. ${H.oneOffs.slice(0,2).map(t=>(t.merchant||t.cat)+' S$'+fmt(+t.amount)).join(', ')})`:''}.`);
  return {rows,total,income,lifestyle:life,household:hh,housing,months:H.months,weight:w,notes,sources:BUDGET_SOURCES};
}

function draftTx(){ const note=(draft.note||'').trim()||undefined; if(isNC()) return {src:draft.src,amount:+draft.amount||0,cat:draft.cat,channel:'online',fcy:false,merchant:draft.merchant,date:draft.date,card:null,note};

function payWithKey(){ const d=draft; if(d.via) return d.via; return d.channel==='instore'?(d.pay||'wallet'):(d.inApp?'inapp':'card'); }

function updateReco(){
  const box=$('#reco'); if(!box) return; const d=draftTx();
  if(isNC()){ const sv=SRC[draft.src]; box.innerHTML=`<div class="card nc"><div class="h3">${sv.icon} ${esc(sv.name)}</div><div class="sub">Earns 0 miles. Not counted in card caps, minimum spend, effective mpd or "miles missed" - it only shows in <b>Expenses</b>.${(S.settings.excludeCats||[]).includes(d.cat)?' This category is excluded from expense totals (change in More → Backup & settings).':''}</div></div>`;

  if(!held().length){box.innerHTML='';return;}

  const minWarn=x=>{ const c=x.card; if(!c.min && !Object.values(c.pools||{}).some(p=>p.min)) return '';
     return c.assumeMin===false?`<div class="warn">Min spend not assumed - bonus only once actual spend reaches it.</div>`:`<div class="warn">Assumes you'll meet the min spend${c.min?' (S$'+c.min+'/'+(c.cycle==='statement'?'statement':'calendar')+' month)':' (S$1,000 per category per statement month)'}.</div>`; };
  const BADGE={bonus:['ok',''],partial:['amber','Partial cap'],capped:['red','Cap reached'],minspend:['red','Min spend not met'],ineligible:['grey','Not eligible'],base:['grey','Base rate']};
  const row=(x,i)=>{ const bd=BADGE[x.status]||['','']; const dim=['capped','minspend','ineligible'].includes(x.status)||(x.status==='base'&&i>0);

       <div class="grow"><div><b>${esc(short(x.card.name))}</b> ${i===0?'<span class="tag">BEST</span>':''} ${bd[1]&&!(i===0&&x.status==='base')?`<span class="badge ${bd[0]}">${bd[1]}</span>`:''}</div>
       <div class="sub">${x.parts.map(p=>`S$${fmt(p.amt)} @ ${p.mpd} mpd${p.label!=='Base rate'?' ('+esc(p.label)+')':' (base)'}`).join(' + ')||'0 miles (excluded)'}${x.fee?` · ⚠️ Amaze fee ~${money(x.fee)}`:''}</div>
       ${x.reason&&(x.status!=='bonus'||x.verify)?`<div class="why ${x.verify&&x.status==='bonus'?'amber':bd[0]}">${x.verify?'❓ ':''}${esc(x.reason)}</div>`:''}
       ${x.status==='bonus'||x.status==='partial'?minWarn(x):''}</div>
       <div class="miles">${n0(x.miles)}<small> mi</small><br><small>${(x.miles/amt).toFixed(2)} mpd</small></div></label>`; };
  const sp=r.split;
  box.innerHTML=`<div class="card">
    <div class="h3">${d.amount>0?'Card ranking':'Card ranking <small>for S$100 - enter amount</small>'}</div>

      const nTop=Math.max(2,1+bl.length); return ord.slice(0,nTop).map((x,i)=>row(x,i)).join('')+(ord.length>nTop?`<details><summary>Compare all ${ord.length} cards</summary>${ord.slice(nTop).map((x,i)=>row(x,i+nTop)).join('')}</details>`:''); })()}

function saveTx(){

    Object.keys(t).forEach(k=>delete t[k]); Object.assign(t,rec,keep); Object.keys(t).forEach(k=>t[k]===undefined&&delete t[k]); editingId=null; }
  else { t={...rec,id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now()}; S.txs.push(t); }
  syncRecurring(t,!!draft.repeat);
  S.settings.last={src:rec.src,cat:rec.cat,channel:draft.channel,pay:draft.pay};
  save(); const keepDate=draft.date; const c=cardById(t.card);
  const H=content().byCat[t.cat]; lastHint=(!wasEdit&&S.settings.saveHints!==false&&H&&H.tip)?{cat:t.cat,tip:H.tip}:null;

  render(); window.scrollTo(0,0);
}

function setTheme(t){ S.settings.theme=t; save(); applyTheme(); render(); }
/* repeat-monthly templates live in S.recurring; each auto-added entry is a normal, editable transaction */
function syncRecurring(t,on){
  let r=t.recurId&&S.recurring.find(x=>x.id===t.recurId);
  if(on){
    const f={amount:+t.amount,cat:t.cat,src:t.src||'card',card:t.card||null,channel:t.channel,pay:t.pay,merchant:t.merchant||'',day:+t.date.slice(8)};
    if(r){ Object.assign(r,f,{active:true}); }
    else { r={id:'rc'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),...f,active:true,lastMonth:[t.date.slice(0,7),today().slice(0,7)].sort().pop()}; S.recurring.push(r); t.recurId=r.id; }
  } else if(r){ r.active=false; }
}
function stopRecurring(id){ const r=S.recurring.find(x=>x.id===id); if(r){ r.active=false; save(); render(); toast('Stopped repeating'); } }
function editTx(id){ const t=S.txs.find(t=>t.id===id); if(!t) return; editingId=id; const rr=t.recurId&&S.recurring.find(x=>x.id===t.recurId); draft={src:t.src||'card',repeat:!!(rr&&rr.active),amount:t.amount,cat:t.cat,channel:t.channel||'online',pay:t.pay||(t.wallet===false?'tap':'wallet'),inApp:!!t.inApp,via:t.via||null,note:t.note||'',fcy:!!t.fcy,sea:!!t.sea,merchant:t.merchant||'',date:t.date,catTouched:true}; pickedCard=t.card; pickedManual=true; lastHint=null; setView('add'); }
function cancelEdit(){ editingId=null; draft=freshDraft(); pickedCard=null; pickedManual=false; goSpendMonth(); }
function delTx(id){ const k=S.txs.findIndex(x=>x.id===id); if(k<0) return; const t=S.txs[k]; S.txs.splice(k,1);
  const r=t.recurId&&S.recurring.find(x=>x.id===t.recurId); if(r&&r.active&&confirm('This entry repeats monthly. Stop repeating it too? (Cancel = keep repeating)')) r.active=false;
  save(); render(); toast('Deleted','Undo',()=>{ S.txs.splice(Math.min(k,S.txs.length),0,t); save(); render(); toast('Restored'); }); }

/* ---------- Month ---------- */
function shiftMonth(k){ let [y,m]=viewMonth.split('-').map(Number); m+=k; if(m<1){m=12;y--;} if(m>12){m=1;y++;} viewMonth=y+'-'+pad(m); render(); }
function refDateForMonth(){ const t=today(); if(t.slice(0,7)===viewMonth) return t; const [y,m]=viewMonth.split('-').map(Number); return ymd(new Date(y,m,0)); }
function switchTarget(ps){
  const rule=(ps.card.rules||[]).find(r=>(r.pools||[]).includes(ps.pid)) || (S.cards.find(c=>(c.rules||[]).some(r=>(r.pools||[]).includes(ps.pid)))||{rules:[]}).rules.find(r=>(r.pools||[]).includes(ps.pid));
  if(!rule) return null; let cats=ruleCats(rule,ps.card); const labels={};
  if(cats==='all'){ const c0=rule.fcy==='fcy'?'fcy':rule.channel==='online'?'shopping':'contactless'; cats=[c0]; labels[c0]=rule.fcy==='fcy'?'FCY spend':rule.channel==='online'?'online spend':'in-store tap'; }
  const out=[];
  for(const cat of cats.slice(0,3)){
    const ch=rule.channel==='any'?CAT[cat].ch:rule.channel;
    const r=recommend(S,{amount:100,cat,channel:ch,pay:'wallet',fcy:rule.fcy==='fcy'||cat==='fcy',merchant:'',date:refDateForMonth()});
    const alt=r.list.find(x=>x.card.id!==ps.card.id && !(x.parts||[]).some(p=>(rule.pools||[]).length && p.label===ruleLabel(rule,ps.card)));
    if(alt) out.push({cat,alt,ch,label:labels[cat]||CAT[cat].name});
  }
  return out;
}

   <div class="sub">A repeating entry is added automatically the first time you open the app in a new month. Each one is a normal transaction you can edit or delete.</div></div>
  <div class="card"><div class="h3">How miles are calculated (assumptions)</div><ul class="sub">
   <li>Each card has bonus rules (category, online/in-store, payment method, SGD/FCY, merchant keywords) and cap pools. A purchase uses the highest-mpd rule whose cap still has room. Overflow goes to the base rate, and the app suggests a split when that earns more.</li>
   <li><b>Gates:</b> a card is greyed out with a reason when its cap is used up ("Cap reached"), its minimum spend isn't met ("Min spend not met"), or the purchase doesn't qualify ("Not eligible", e.g. a physical card tap on UOB PPV, an in-app Apple Pay payment on Citi Rewards, fast food on HSBC Revolution, Agoda/Expedia on HSBC, streaming on Lady's Entertainment).</li>
   <li>Bonus mpd is the total rate (base + bonus). Earning blocks: UOB rounds down to S$5, Citi/HSBC/DBS to S$1 (DBS S$5 for base). HSBC and Lady's bonus are worked out on the exact amount.</li>
   <li>Caps reset per calendar month (DBS WWMC by transaction date; HSBC, UOB PPV and Lady's by posting date) or per statement month from the day you set (Citi Rewards and UOB Visa Signature - set your statement date in Cards). The exact T&C clauses are in Cards → Details.</li>
   <li><b>Pay with</b> changes eligibility: PayPal earns nothing on HSBC Revolution and UOB Lady's; Amaze only earns with Citi Rewards (UOB and DBS exclude it); a GrabPay wallet top-up earns nothing anywhere; in-app Apple Pay is not a Citi Rewards online bonus. See Card playbook → Wallets.</li>
   <li>UOB Visa Signature needs S$1,000 per statement month in each bucket (FCY / local contactless). Logged spend only earns the bonus once the total reaches it ("pending"). Recommendations don't assume it unless you tick that option.</li>
   <li>Category ≠ MCC. Banks pay bonuses by merchant category code, and the app maps categories to typical MCCs. Bills/insurance earn no bonus (UOB/HSBC earn 0 on them).</li>
   <li>Bank transfer / PayNow / Cash entries earn 0 miles and are ignored for caps, minimum spend, recommendations, effective mpd and miles missed. They only count in Expenses.</li>
   <li>Not modelled in miles totals: welcome offers, Kris+/HeyMax/ShopBack extras (see Save more), UOB Lady's Savings boost, Citi PayAll, FCY fees (≈3.25%) and Amaze's 1% SGD fee (warning only).</li></ul></div>`;

const PALETTE=['#2e6be6','#12b76a','#f5a524','#e04f8a','#7a5af8','#98a2b3'];

/* ---------- 1-year overview ---------- */
function yearData(endYm){
  const months=[]; for(let k=11;k>=0;k--) months.push(ymAdd(endYm,-k));
  const L=evalLedger(S);
  const per=months.map(ym=>{ const t=monthTotals(S,ym); const cs=cardMonthStats(S,ym,L); return {ym,total:t.total,byCat:t.byCat,miles:cs.miles,cardSpend:cs.spend,count:t.count}; });
  const catTot={}; for(const p of per) for(const [c,v] of Object.entries(p.byCat)) catTot[c]=(catTot[c]||0)+v;
  const active=per.filter(p=>p.count>0).length;
  return {months,per,catTot,active,total:per.reduce((s,p)=>s+p.total,0),miles:per.reduce((s,p)=>s+p.miles,0),cardSpend:per.reduce((s,p)=>s+p.cardSpend,0)};
}
function viewYear(){
  const endYm=today().slice(0,7); const Y=yearData(endYm);
  const cats=Object.entries(Y.catTot).sort((a,b)=>b[1]-a[1]); const top=cats.slice(0,5).map(x=>x[0]);
  const colorOf=c=>{ const k=top.indexOf(c); return PALETTE[k<0?5:k]; };
  const W=360,H=170,pl=4,pb=18,bw=(W-pl)/12; const max=Math.max(1,...Y.per.map(p=>p.total));
  const bars=Y.per.map((p,i)=>{ let y=H-pb; const segs=[]; const parts=[...top.map(c=>[c,p.byCat[c]||0]),['__other',Object.entries(p.byCat).filter(([c])=>!top.includes(c)).reduce((s,[,v])=>s+v,0)]];
    for(const [c,v] of parts){ if(!v) continue; const h=v/max*(H-pb-16); y-=h; segs.push(`<rect x="${(pl+i*bw+3).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" fill="${c==='__other'?PALETTE[5]:colorOf(c)}" rx="2"><title>${MONTHS[+p.ym.slice(5)-1]} ${esc(c==='__other'?'Other':catName(c))}: ${money0(v)}</title></rect>`); }
    return `<g class="ybar" onclick="viewMonth='${p.ym}';goSpendMonth()">${segs.join('')}<rect x="${(pl+i*bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"/>${p.total?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" class="yl">${kfmt(p.total)}</text>`:''}<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle" class="ym ${p.ym===endYm?'on':''}">${MONTHS[+p.ym.slice(5)-1].slice(0,1)}${i===0||p.ym.endsWith('-01')?'<tspan class="yy">'+p.ym.slice(2,4)+'</tspan>':''}</text></g>`; }).join('');
  const maxM=Math.max(1,...Y.per.map(p=>p.miles)); const MH=80;
  const mbars=Y.per.map((p,i)=>{ const h=p.miles/maxM*(MH-26); return `<rect x="${(pl+i*bw+5).toFixed(1)}" y="${(MH-14-h).toFixed(1)}" width="${(bw-10).toFixed(1)}" height="${h.toFixed(1)}" fill="var(--ok-bar)" rx="2"><title>${MONTHS[+p.ym.slice(5)-1]}: ${n0(p.miles)} miles</title></rect>${p.miles?`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${(MH-17-h).toFixed(1)}" text-anchor="middle" class="yl">${kfmt(p.miles)}</text>`:''}<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${MH-3}" text-anchor="middle" class="ym">${MONTHS[+p.ym.slice(5)-1].slice(0,1)}</text>`; }).join('');
  const div=Math.max(1,Y.active); const budgets=S.settings.budgets||{};
  const spark=c=>{ const vals=Y.per.map(p=>p.byCat[c]||0), mx=Math.max(1,...vals); return `<svg class="spark" viewBox="0 0 72 18" preserveAspectRatio="none">${vals.map((v,i)=>`<rect x="${i*6}" y="${(18-v/mx*17).toFixed(1)}" width="4.5" height="${(v/mx*17).toFixed(1)}" fill="${colorOf(c)}"/>`).join('')}</svg>`; };
  const last3=c=>[1,2,3].map(k=>{const p=Y.per[11-k]; return p?p.byCat[c]||0:0;}).reduce((a,b)=>a+b,0)/3;
  const noData=!Y.total;
  return `<div class="stats">
    <div><small>12-month spend</small><b>${money0(Y.total)}</b></div>
    <div><small>Monthly average</small><b>${money0(Y.total/div)}</b><small class="sub">${Y.active} month${Y.active===1?'':'s'} with data</small></div>
    <div><small>Miles (12 months)</small><b>${n0(Y.miles)}</b></div>
    <div><small>Avg mpd on cards</small><b>${Y.cardSpend?(Y.miles/Y.cardSpend).toFixed(2):'–'}</b></div></div>
  <div class="card"><div class="h3">Monthly spend <small>${MONTHS[+Y.months[0].slice(5)-1]} ${Y.months[0].slice(0,4)} – ${MONTHS[+endYm.slice(5)-1]} ${endYm.slice(0,4)} · tap a month</small></div>
   ${noData?'<div class="sub">No expenses logged yet. Add a few and this chart fills in.</div>':`<svg class="ychart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spend, stacked by category">${bars}</svg>
   <div class="legend">${top.map(c=>`<span><i style="background:${colorOf(c)}"></i>${esc(CAT[c]?CAT[c].short:c)}</span>`).join('')}${cats.length>5?`<span><i style="background:${PALETTE[5]}"></i>Other</span>`:''}</div>`}</div>
  <div class="card"><div class="h3">Miles per month</div>${Y.miles?`<svg class="ychart" viewBox="0 0 ${W} ${MH}" role="img" aria-label="Miles per month">${mbars}</svg>`:'<div class="sub">No card spend yet.</div>'}</div>
  <div class="card"><div class="h3">By category <small>12-month total · avg per month · trend</small></div>
   ${cats.length?`<table class="ytable"><thead><tr><th>Category</th><th>12 mo</th><th>Avg/mo</th><th>Trend</th></tr></thead><tbody>${cats.map(([c,v])=>{ const avg=v/div, b=+budgets[c]||0, l3=last3(c);
     return `<tr><td>${catIcon(c)} ${esc(CAT[c]?CAT[c].short:c)}${b?`<div class="sub">budget ${money0(b)}${avg>b*1.05?' <b class="up">over</b>':''}</div>`:''}</td><td>${money0(v)}</td><td>${money0(avg)}${l3&&Math.abs(l3-avg)/Math.max(1,avg)>0.2?`<div class="sub ${l3>avg?'up':'down'}">last 3: ${money0(l3)}</div>`:''}</td><td>${spark(c)}</td></tr>`; }).join('')}
     <tr class="tot"><td>Total</td><td>${money0(Y.total)}</td><td>${money0(Y.total/div)}</td><td></td></tr></tbody></table>
   <div class="sub">Average = total ÷ months with any entry (${Y.active}). Excluded categories (${esc((S.settings.excludeCats||[]).map(catName).join(', ')||'none')}) are left out.</div>`:'<div class="sub">–</div>'}</div>
  <div class="btnrow"><button onclick="goSpendMonth()">🗓️ This month's details & transactions</button><button onclick="setView('budgets')">✨ Suggest budgets</button></div>`;
}

/* ---------- Budget suggester ---------- */
let budgetSel=null, budgetEdit={};
function budgetOpts(){ return S.settings.budgetOpts||{lifestyle:'moderate',household:1,housing:'room',income:''}; }
function setBudgetOpt(k,v){ S.settings.budgetOpts={...budgetOpts(),[k]:v}; save(); budgetSel=null; budgetEdit={}; render(); }
function viewBudgetWizard(){
  const o=budgetOpts(); const R=suggestBudgets(S,o,today()); const cur=S.settings.budgets||{};
  if(!budgetSel) budgetSel=Object.fromEntries(R.rows.map(r=>[r.cat,true]));
  const D=defaultBudgets(); const srcs=R.sources;
  return `<div class="mswitch"><button onclick="setView('more')" aria-label="Back">‹</button><b>Suggest budgets</b><span style="width:52px"></span></div>
  <div class="card"><div class="sub">Combines your own history (median of up to 6 complete months, one-off big purchases ignored) with Singapore benchmarks. All inputs are optional.</div>
   <div class="grid2"><label>Take-home pay S$/month<input type="number" inputmode="decimal" min="0" step="50" placeholder="optional" value="${esc(o.income||'')}" onchange="setBudgetOpt('income',+this.value||'')"></label>
    <label>Household size<input type="number" min="1" max="10" inputmode="numeric" value="${esc(o.household||1)}" onchange="setBudgetOpt('household',+this.value||1)"></label></div>
   <label>Housing<select onchange="setBudgetOpt('housing',this.value)">${Object.entries(HOUSING).map(([k,h])=>`<option value="${k}" ${o.housing===k?'selected':''}>${esc(h.label)}</option>`).join('')}</select></label>
   <div class="seg">${['frugal','moderate','comfortable'].map(l=>`<button class="${o.lifestyle===l?'on':''}" onclick="setBudgetOpt('lifestyle','${l}')">${l[0].toUpperCase()+l.slice(1)}</button>`).join('')}</div></div>
  <div class="card"><div class="h3">Suggested monthly budgets <small>${R.months?`${R.months} month${R.months>1?'s':''} of history · ${Math.round(R.weight*100)}% your data`:'benchmarks only (no history yet)'}</small></div>
   ${R.rows.map(r=>{ const v=budgetEdit[r.cat]!==undefined?budgetEdit[r.cat]:r.amount; return `<div class="brow"><label class="tog" style="margin:0"><input type="checkbox" ${budgetSel[r.cat]?'checked':''} onchange="budgetSel['${r.cat}']=this.checked"> <b>${catIcon(r.cat)} ${esc(catName(r.cat))}</b></label>
     <input class="bud" type="number" min="0" step="10" value="${v}" onchange="budgetEdit['${r.cat}']=+this.value">
     <div class="sub">${esc(r.why)}${cur[r.cat]?` <b>Now: ${money0(cur[r.cat])}</b>`:''}</div></div>`; }).join('')}
   <div class="kv"><b>Total</b><b>${money0(R.rows.reduce((s,r)=>s+(budgetEdit[r.cat]!==undefined?budgetEdit[r.cat]:r.amount),0))}/month</b></div>
   ${R.notes.map(n=>`<div class="note">💡 ${esc(n)}</div>`).join('')}
   <div class="btnrow"><button class="primary" onclick="applySuggested()">Apply ticked budgets</button></div>
   <div class="sub">Apply replaces the budget for each ticked category only. You can still edit any budget in Spend → Month.</div></div>
  <details class="card"><summary>Default set: single working adult, moderate lifestyle (${money0(D.total)}/month)</summary>
   ${D.rows.map(r=>`<div class="kv"><span>${catIcon(r.cat)} ${esc(catName(r.cat))}</span><b>${money0(r.amount)}</b></div>`).join('')}
   <div class="sub">Plus save ≥20% of take-home first (MoneySense). Benchmarks assume renting a master room in an HDB flat and eating out most meals.</div>
   <div class="btnrow"><button onclick="applyDefaultBudgets();render()">Use this default set</button></div></details>
  <div class="card"><div class="h3">Sources</div><ul class="sub">${Object.values(srcs).filter(x=>x[1]).map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}
   <li>HES 2023: average household spend S$5,931/month - housing 29.8% (incl. imputed rent of owner-occupied homes), food 20.0%, transport 13.4%; eating out S$966/month. Lines marked "Estimate" have no single official SG figure.</li></ul></div>`;
}
function applySuggested(){ const R=suggestBudgets(S,budgetOpts(),today()); let n=0;
  for(const r of R.rows){ if(!budgetSel[r.cat]) continue; const v=budgetEdit[r.cat]!==undefined?budgetEdit[r.cat]:r.amount; if(v>0){ S.settings.budgets[r.cat]=v; n++; } else delete S.settings.budgets[r.cat]; }
  save(); toast(`Applied ${n} budget${n===1?'':'s'}`); budgetSel=null; budgetEdit={}; editBudgets=false; goSpendMonth(); }
function applyDefaultBudgets(quiet){ const D=defaultBudgets(); for(const r of D.rows) S.settings.budgets[r.cat]=r.amount; save(); if(!quiet) toast('Default budgets applied'); }

/* ---------- Fees, cap rules, wallets ---------- */
function capBasisText(id){ const r=CAP_RULES[id]; if(!r) return '?'; return r.basis==='none'?'- no cap':r.basis==='statement'?'per statement month':`per calendar month (by ${r.date} date)`; }
function feeCapHtml(c){ const f=FEE_INFO[c.id], r=CAP_RULES[c.id]; if(!f&&!r) return '';
  const card=S.cards.find(x=>x.id===c.id)||c; const needStmt=r&&r.basis==='statement'&&c.id!=='amaze_citi';
  return `<div class="info fee">${f?`<div><b>Annual fee:</b> ${esc(f.fee)}</div><div><b>Waiver:</b> ${esc(f.waiver)}</div><div class="sub"><a href="${esc(f.src)}" target="_blank" rel="noopener">Fee source</a> · checked ${esc(FEES_CHECKED)}${card.feeMonth?` · your fee month: ${MONTHS[card.feeMonth-1]}`:''}</div>`:''}
   ${r?`<div style="margin-top:6px"><b>Bonus cap resets:</b> ${esc(capBasisText(c.id))}${needStmt?(card.stmtSet?` - your statement cycle starts on day ${card.stmtDay}`:' - <span class="vf">set your statement date</span>'):''}</div><div class="sub">“${esc(r.clause.replace(/^"|"$/g,''))}” <a href="${esc(r.src)}" target="_blank" rel="noopener">T&Cs</a></div>`:''}</div>`; }
const WMARK={yes:['✅','ok'],base:['➖','base'],no:['❌','no'],'n/a':['⛔','no'],verify:['❓','vfy']};
function walletsHtml(hs){ const ids=hs.map(c=>c.id).filter(id=>WALLETS[id]);
  if(!ids.length) return '';
  return `<div class="card" id="wallets"><div class="h3">📱 Wallets & payment apps <small>does the bonus still apply?</small></div>
   <div class="sub">✅ bonus · ➖ base rate only · ❌ earns nothing / excluded · ⛔ not possible · ❓ unverified. Checked ${esc(CONTENT_CHECKED)}. Tap a row for the reason.</div>
   ${WALLET_ROWS.map(w=>`<details class="wrow"><summary><b>${esc(w.name)}</b><div class="wchips">${ids.map(id=>{ const v=WALLETS[id][w.id]||['verify','']; const m=WMARK[v[0]]||WMARK.verify; return `<span class="wc ${m[1]}">${m[0]} ${esc(short(cardById(id).name).replace(/^(UOB|Citi|DBS|HSBC) /,''))}</span>`; }).join('')}</div></summary>
     <ul class="sub">${ids.map(id=>{ const v=WALLETS[id][w.id]||['verify','not checked']; return `<li><b>${esc(short(cardById(id).name))}:</b> ${(WMARK[v[0]]||WMARK.verify)[0]} ${esc(v[1])}${v[0]==='verify'?' <span class="vf">verify</span>':''}</li>`; }).join('')}</ul></details>`).join('')}
   <div class="sub" style="margin-top:6px"><b>Rules of thumb:</b> tap Apple Pay in store for HSBC Revolution / UOB PPV contactless bonuses; never pay Citi Rewards with in-app Apple Pay (use card details, or Amaze); save the card itself in Grab instead of topping up GrabPay; avoid PayPal on HSBC and Lady's. In Add, “Pay with” applies these rules automatically.</div>
   <div class="sub">Sources: ${WALLET_SOURCES.map(([t,u],k)=>`<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(t)}">${k+1}. ${esc(t)}</a>`).join(' · ')}</div></div>`; }

/* ---------- Cloud sync (private GitHub repo) ---------- */
const SYNC_KEY='sgMilesTracker.sync'; // device-only: token + repo settings. Never part of exported/synced data.
function syncCfg(){ let c=null; try{ c=JSON.parse(localStorage.getItem(SYNC_KEY)); }catch(e){} return {owner:'raymondta27',repo:'miles-tracker-data',path:'data.json',branch:'main',token:'',api:'',...(c||{})}; }
function setSyncCfg(p){ const c={...syncCfg(),...p}; localStorage.setItem(SYNC_KEY,JSON.stringify(c)); return c; }
let syncBusy=false, syncAgain=false, syncTimer=null, lastPullAt=0;
function fmtTime(ms){ if(!ms) return 'never'; const d=new Date(ms); return d.toLocaleString('en-SG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})+' SGT'; }
function syncSummaryLine(){ const c=syncCfg(); if(!c.token) return 'Off · share data with your laptop / assistant via a private GitHub repo'; return c.error?'⚠️ '+c.error.slice(0,70):`On · last synced ${fmtTime(c.lastSync)}${c.dirty?' · changes waiting':''}`; }
function syncAfterSave(){ const c=syncCfg(); if(!c.token) return; if(!c.dirty) setSyncCfg({dirty:true}); clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow({quiet:true}),4000); }
function syncOnOpen(){ const c=syncCfg(); if(c.token) syncNow({quiet:true}); }
window.addEventListener&&window.addEventListener('online',()=>{ const c=syncCfg(); if(c.token&&c.dirty) syncNow({quiet:true}); });
document.addEventListener&&document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&syncCfg().token&&Date.now()-lastPullAt>60000) syncNow({quiet:true}); });
async function syncNow(opts){ opts=opts||{}; const c=syncCfg();
  if(!c.token){ if(!opts.quiet) toast('Paste your token first'); return; }
  if(syncBusy){ syncAgain=true; return; }
  if(typeof navigator!=='undefined'&&navigator.onLine===false){ setSyncCfg({dirty:true,status:'offline'}); if(view==='sync') render(); if(!opts.quiet) toast('Offline - will sync when back online'); return; }
  syncBusy=true; if(view==='sync') render();
  const before=S.txs.length;
  try{
    if(opts.upload) stampAll(S,Date.now());
    const client=ghClient(c);
    const r=await syncRound(S,client,{migrate:migrateState,message:'miles-tracker app sync ('+(opts.upload?'upload phone data':'auto')+')'});
    const changedLocal=JSON.stringify(r.state)!==JSON.stringify(S);
    if(changedLocal){ S=r.state; setKfMode(S.settings.kf!==false); applyRecurring(S,today()); }
    saveNoStamp(); lastPullAt=Date.now();
    setSyncCfg({lastSync:Date.now(),lastSha:r.sha,dirty:false,status:r.pushed?(r.created?'created':'pushed'):'up to date',error:''});
    const d=S.txs.length-before;
    if(!opts.quiet||opts.upload) toast(opts.upload?`Uploaded - cloud now has ${S.txs.length} entries`:r.pushed?(d>0?`Synced · ${d} new from cloud`:'Synced ✓'):(d?`Synced · ${d>0?'+':''}${d} entries`:'Already up to date'));
    else if(d>0) toast(`☁️ ${d} new entr${d>1?'ies':'y'} from sync`);
    if(changedLocal&&view!=='add') render(); else if(view==='sync') render();
  }catch(e){ setSyncCfg({error:String(e.message||e),status:'error'}); if(!opts.quiet) toast('Sync failed: '+(e.message||e)); if(view==='sync') render(); }
  finally{ syncBusy=false; if(syncAgain){ syncAgain=false; setTimeout(()=>syncNow({quiet:true}),500); } }
}
function saveSyncForm(){ const v=id=>($('#'+id)||{}).value; const tok=(v('sy_tok')||'').trim();
  const p={owner:(v('sy_owner')||'').trim()||'raymondta27',repo:(v('sy_repo')||'').trim()||'miles-tracker-data',path:(v('sy_path')||'').trim()||'data.json',branch:(v('sy_branch')||'').trim()||'main'};
  if(tok) p.token=tok; if(tok&&!/^(github_pat_|ghp_|gho_|test-)/.test(tok)&&!confirm('That does not look like a GitHub token. Save anyway?')) return; setSyncCfg({...p,error:''}); toast('Saved on this device'); render(); }
function forgetToken(){ if(!confirm('Remove the token from this device? Your data stays here and in the repo.')) return; setSyncCfg({token:'',status:'',error:''}); render(); }
function uploadPhoneData(){ if(!confirm(`Upload this device's ${S.txs.length} entries and settings to the cloud file? They are MERGED with what is already there (nothing in the cloud is deleted); this device's settings and card setup win.`)) return; syncNow({upload:true}); }
function viewSync(){ const c=syncCfg(); const on=!!c.token;
  return backBar('Sync')+`<div class="card"><div class="h3">☁️ Cloud sync <small>${on?'on':'off'}</small></div>
   <div class="sub">Keeps this phone, your other devices and your assistant's command-line tool on one shared ledger: a <b>private</b> GitHub repo holding <code>${esc(c.path)}</code> (same format as Export JSON). Edits merge per entry; nothing is overwritten wholesale.</div>
   ${on?`<div class="syncst ${c.error?'bad':c.dirty?'warn':'ok'}">${syncBusy?'⏳ Syncing…':c.error?'⚠️ '+esc(c.error):c.status==='offline'?'📴 Offline - changes are saved here and will sync when you are back online':c.dirty?'⏳ Changes waiting to upload':'✅ Up to date'}<div class="sub">Last synced: ${esc(fmtTime(c.lastSync))}${c.lastSha?' · version '+esc(String(c.lastSha).slice(0,7)):''}</div></div>
   <div class="btnrow"><button class="primary" onclick="syncNow()" ${syncBusy?'disabled':''}>🔄 Sync now</button><button onclick="uploadPhoneData()" ${syncBusy?'disabled':''}>⬆️ Upload my phone data</button></div>
   <div class="sub">Auto: pulls when the app opens or comes back to the foreground, uploads ~4 s after each change, and retries when you're back online.</div>`:''}</div>
  <div class="card"><div class="h3">${on?'Connection':'Set up (once per device)'}</div>
   <label>GitHub token (fine-grained, this repo only, Contents read & write)<input id="sy_tok" type="password" autocomplete="off" spellcheck="false" placeholder="${on?'•••• saved on this device - paste to replace':'github_pat_…'}"></label>
   <div class="grid2"><label>Owner<input id="sy_owner" value="${esc(c.owner)}"></label><label>Repo<input id="sy_repo" value="${esc(c.repo)}"></label>
   <label>File path<input id="sy_path" value="${esc(c.path)}"></label><label>Branch<input id="sy_branch" value="${esc(c.branch)}"></label></div>
   <div class="btnrow"><button class="primary" onclick="saveSyncForm()">Save</button>${on?'<button class="danger" onclick="forgetToken()">Forget token</button>':''}</div>
   <div class="sub">🔒 The token is stored only in this browser's local storage under its own key. It is not in the app file, not in Export JSON, not in the synced data, and is sent only to api.github.com.</div></div>
  <details class="card"><summary>How to create the token</summary><ol class="steps">
   <li>On GitHub create a <b>private</b> repo <code>raymondta27/miles-tracker-data</code> (Settings → Repositories → New; tick Private).</li>
   <li>Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token.</li>
   <li>Resource owner: raymondta27 · Repository access: <b>Only select repositories</b> → miles-tracker-data.</li>
   <li>Permissions → Repository → <b>Contents: Read and write</b> (Metadata: read-only is added automatically). Nothing else.</li>
   <li>Pick an expiry (e.g. 1 year), Generate, copy it, paste it above and Save. Then tap <b>Upload my phone data</b> once on the phone that has your history.</li>
   <li>On other devices paste the same token (or make a second one the same way) - they pull everything on open.</li></ol>
   <div class="sub">If the token leaks: GitHub → Fine-grained tokens → Revoke. It can only touch that one repo.</div></details>
  <details class="card"><summary>How merging works</summary><ul class="sub">
   <li>Each entry has an id and an "updated" time; for the same entry the newer edit wins.</li>
   <li>Deletes leave a small marker (kept 1 year) so a deleted entry doesn't come back from another device.</li>
   <li>Budgets, card setup (statement dates, fee months, ticks) and other settings: the most recently changed one wins. Theme and "last used" choices stay per device.</li>
   <li>Offline edits are kept and merged on the next sync. If two devices save at the same instant, the app retries automatically.</li></ul></details>`; }
</script></body></html>
