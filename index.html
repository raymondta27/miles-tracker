DEFAULT_CARDS.forEach(c=>{c.checked=CHECKED; if(c.min && c.assumeMin===undefined) c.assumeMin=true;});
let KF_MODE=true; function setKfMode(v){KF_MODE=!!v;}

/* ---------- dates & cycles ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function cycleStart(card,dateStr){
  const d=parseD(dateStr); const sd=card.cycle==='statement'?Math.min(Math.max(1,+card.stmtDay||1),28):1;
  let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()<sd){ m--; if(m<0){m=11;y--;} }
  return y+'-'+pad(m+1)+'-'+pad(sd);
}
function cycleEnd(card,dateStr){const s=parseD(cycleStart(card,dateStr)); const e=new Date(s.getFullYear(),s.getMonth()+1,s.getDate()-1); return ymd(e);}

/* ---------- pools ---------- */
function allPools(cards){const p={}; cards.forEach(c=>Object.entries(c.pools||{}).forEach(([id,v])=>p[id]={...v,id,owner:c.id})); return p;}
function poolCycleCard(cards,poolId){const P=allPools(cards); return cards.find(c=>c.id===(P[poolId]||{}).owner);}

/* ---------- rule matching ---------- */
function ladyCats(card){ const o=card.options||{}; return o.ladyCats||[o.ladyCat||'dining']; }
function ruleCats(rule,card){ if(rule.cats==='all') return 'all'; return rule.cats.map(x=>x==='@ladyCat'?ladyCats(card)[0]:x==='@lady0'?ladyCats(card)[0]:x==='@lady1'?ladyCats(card)[1]:x).filter(Boolean); }
function payOf(tx){ if(tx.channel!=='instore') return null; if(tx.pay) return tx.pay; return tx.wallet===false?'tap':'wallet'; }
const PAYNAME={wallet:'phone/watch tap',tap:'physical card tap',chip:'chip/swipe'};
/* returns {ok:true} or {ok:false, near:bool, reason} ; near = the category matched so the reason is a real "gotcha" */
function ruleCheck(rule,card,tx){
  const cat=tx.cat; const fcy=!!tx.fcy||cat==='fcy'; const no=(reason,near=true)=>({ok:false,near,reason});
  if(rule.requires && !((card.options||{})[rule.requires])) return no('condition not met',false);
  const cats=ruleCats(rule,card);
  if(rule.merchant){ let m=false; try{m=new RegExp(rule.merchant,'i').test(tx.merchant||'');}catch(e){} if(!m) return no('merchant-specific',false); }
  else if(cats!=='all' && !cats.includes(cat)) return no('no bonus for this category',false);
  if(NOBONUS_CATS.includes(cat)) return no('rent/loan/tax/transfer-type payments usually get no bonus (often excluded MCCs)',false);
  if((cat==='bills'||cat==='insurance') && !rule.allowBills) return no(cat==='bills'?'bills/utilities get no bonus':'insurance gets no bonus',false);
  if(rule.excl && rule.excl.includes(cat)) return no((rule.exclWhy||{})[cat]||'category excluded');
  if(rule.until && tx.date>rule.until) return no('promo ended');
  if(rule.fcy==='fcy' && !fcy) return no('needs foreign-currency spend',cats!=='all');
  if(rule.fcy==='sgd' && fcy) return no('SGD only',cats!=='all');
  if(rule.sea && !tx.sea) return no('only IDR/MYR/THB/VND',false);
  if(rule.channel==='online' && tx.channel!=='online') return no('online/in-app only');
  if(rule.channel==='instore' && tx.channel!=='instore') return no('in-store only');
  const pay=payOf(tx);
  if(tx.channel==='instore' && rule.pay==='wallet' && pay!=='wallet') return no(`needs Apple/Google/Samsung Pay tap - ${PAYNAME[pay]} earns base only`);
  if(tx.channel==='instore' && rule.pay==='contactless' && pay==='chip') return no('needs contactless (tap) - chip/swipe earns base only');
  if(rule.noInApp && tx.channel==='online' && tx.inApp) return no('in-app Apple/Google Pay is excluded - pay with the card details instead');
  if(rule.catNot && rule.catNot[cat]){ try{ if(new RegExp(rule.catNot[cat].re,'i').test(tx.merchant||'')) return no(rule.catNot[cat].why); }catch(e){} }
  if(rule.notMerchant){ try{ if(new RegExp(rule.notMerchant,'i').test(tx.merchant||'')) return no(rule.notWhy||'merchant excluded'); }catch(e){} }
  return {ok:true};
}
function ruleLabel(r,card){ const m={'@lady0':0,'@lady1':1}; if(Array.isArray(r.cats)&&m[r.cats[0]]!==undefined){const c=CAT[ladyCats(card)[m[r.cats[0]]]]; return "Lady's bonus: "+(c?c.name:'?');} return r.label; }
function ruleMatches(rule,card,tx){ return ruleCheck(rule,card,tx).ok; }
function baseRate(card,tx){ const fcy=!!tx.fcy||tx.cat==='fcy';
  if((card.catRates||{})[tx.cat]!==undefined) return card.catRates[tx.cat];
  if((card.zeroCats||[]).includes(tx.cat)) return 0;
  return fcy?card.baseFcy:card.baseLocal; }

/* usage: { "<poolId>|<cycleStart>": amountUsed } ; minOK(card,tx,poolId)->bool */
function allocate(card,tx,usage,cards,minOK){
  const blk=+card.block||1; const amt=+tx.amount||0; const blockAmt=Math.floor((amt+1e-9)/blk)*blk;
  const base=baseRate(card,tx); const kf=(KF_MODE&&card.kfFactor)?card.kfFactor:1;
  const checks=(card.rules||[]).map(r=>({r,c:ruleCheck(r,card,tx)}));
  const rules=checks.filter(x=>x.c.ok).map(x=>x.r).sort((a,b)=>b.mpd-a.mpd);
  const near=checks.find(x=>!x.c.ok&&x.c.near);
  // bonus portion drawn from exact amount if bank aggregates bonus monthly, else from block-rounded amount
  let left=card.aggBonus?amt:blockAmt; const parts=[]; const delta={};
  const P=allPools(cards); let blockedByMin=null, capHit=null;
  for(const r of rules){ if(left<=0) break;
    const minPools=(r.pools||[]).filter(p=>P[p]&&P[p].min);
    if((card.min && !minOK(card,tx,null)) || minPools.some(p=>!minOK(card,tx,p))){ blockedByMin=blockedByMin||{rule:r,min:card.min||P[minPools[0]].min}; continue; }
    let room=Infinity; const keys=[];
    for(const p of (r.pools||[])){ if(!P[p]) continue; const pc=poolCycleCard(cards,p)||card; const k=p+'|'+cycleStart(pc,tx.date); keys.push(k);
      room=Math.min(room, Math.max(0,P[p].cap-(usage[k]||0)-(delta[k]||0))); }
    const take=Math.min(left,room);
    if(take<left && !capHit) capHit={rule:r,room:Math.max(0,room)};
    if(take<=0) continue;
    keys.forEach(k=>delta[k]=(delta[k]||0)+take);
    const rc=ruleCats(r,card); const spec=rc==='all'?CATS.length-(r.excl||[]).length:Math.max(1,rc.length);
    parts.push({amt:take,mpd:r.mpd,label:ruleLabel(r,card),spec}); left-=take;
  }
  let miles;
  if(card.aggBonus){ // base on whole (block-rounded) amount + bonus uplift on bonus portion
    const bonusAmt=parts.reduce((s,p)=>s+p.amt,0);
    miles=blockAmt*base+parts.reduce((s,p)=>s+p.amt*(p.mpd-base),0);
    const baseLeft=Math.max(0,blockAmt-bonusAmt); if(baseLeft>0) parts.push({amt:+baseLeft.toFixed(2),mpd:base,label:'Base rate'});
  } else { if(left>0) parts.push({amt:left,mpd:base,label:'Base rate'}); miles=parts.reduce((s,p)=>s+p.amt*p.mpd,0); }
  miles*=kf;
  const bonusAmt=parts.filter(p=>p.label!=='Base rate').reduce((s,p)=>s+p.amt,0);
  const spec=Math.min(99,...parts.filter(p=>p.spec).map(p=>p.spec));
  // status for gating UI
  let status='base', reason=null;
  const capName=h=>{ if(!h) return 'bonus'; const pid=(h.rule.pools||[])[0]; const P=allPools(cards)[pid]; const lab=/^@lady/.test((h.rule.cats||[])[0]||'')?ruleLabel(h.rule,card):(P&&P.name)||ruleLabel(h.rule,card); return `${lab} S$${fmt(P?P.cap:0)}/${card.cycle==='statement'?'stmt':'cal'} month`; };
  if(bonusAmt>0 && bonusAmt>=amt-blk+1e-9 && !capHit) status='bonus';
  else if(bonusAmt>0) { status='partial'; reason=`only S$${fmt(bonusAmt)} left in cap (${capName(capHit)}) - rest at ${base} mpd`; }
  else if(capHit && capHit.room<=0) { status='capped'; reason=`Cap reached (${capName(capHit)})`; }
  else if(blockedByMin) { status='minspend'; reason=`Min spend S$${fmt(blockedByMin.min)} not met yet - bonus not counted`; }
  else if(near) { status='ineligible'; reason=near.c.reason; }
  if(base===0 && bonusAmt===0) { status='ineligible'; reason=reason||(tx.cat==='insurance'?'insurance earns no points':'excluded - earns no points'); }
  return {spec,miles:Math.floor(miles+1e-9),parts,delta,bonusAmt,blockedByMin,capHit,matched:rules.length>0,base:+(base*kf).toFixed(2),status,reason,kf,
    fee:(card.feeSgdPct&&!(tx.fcy||tx.cat==='fcy'))?Math.max(0.5,amt*card.feeSgdPct/100):0};
}

/* spend totals for min-spend: card-level (all spend on card in cycle) and pool-level (spend matching rules of that pool) */
function spendTotals(state,excludeId){
  const T={};
  for(const tx of state.txs){ if(tx.id===excludeId || !isCardTx(tx)) continue; const card=state.cards.find(c=>c.id===tx.card); if(!card) continue;
    const k='card:'+card.id+'|'+cycleStart(card,tx.date); T[k]=(T[k]||0)+(+tx.amount);
    const P=allPools(state.cards);
    const seen=new Set();
    (card.rules||[]).forEach(r=>{ if(ruleMatches(r,card,tx)) (r.pools||[]).forEach(p=>{ if(P[p]&&P[p].min&&!seen.has(p)){seen.add(p); const kk='pool:'+p+'|'+cycleStart(card,tx.date); T[kk]=(T[kk]||0)+(+tx.amount);} }); });
  }
  return T;
}
function poolMinFor(cards,p){const P=allPools(cards);return P[p]?P[p].min:0;}

/* Ledger: chronological evaluation of logged transactions (actual min-spend status at cycle end) */
function evalLedger(state){
  const totals=spendTotals(state);
  const minActual=(card,tx,p)=>{ if(p===null) return (totals['card:'+card.id+'|'+cycleStart(card,tx.date)]||0)>=card.min;
     return (totals['pool:'+p+'|'+cycleStart(card,tx.date)]||0)>=poolMinFor(state.cards,p); };
  const usage={}; const res={};
  const txs=[...state.txs].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  for(const tx of txs){
    if(!isCardTx(tx)){ res[tx.id]={miles:0,parts:[],nonCard:true,missed:0,optimal:null,optimalMiles:0}; continue; }
    const card=state.cards.find(c=>c.id===tx.card);
    if(!card){res[tx.id]={miles:0,parts:[],err:'Card not found'};continue;}
    const r=allocate(card,tx,usage,state.cards,minActual);
    // optimal among held cards (optimistic: assume their min spend met if assumeMin)
    let best={card:card,miles:r.miles};
    for(const c of state.cards.filter(c=>c.held && c.id!==card.id)){
      const a=allocate(c,tx,usage,state.cards,(cc,t,p)=>p===null?(cc.assumeMin!==false):true);
      if(a.miles>best.miles) best={card:c,miles:a.miles};
    }
    Object.entries(r.delta).forEach(([k,v])=>usage[k]=(usage[k]||0)+v);
    res[tx.id]={...r,optimal:best.card.id,optimalMiles:best.miles,missed:Math.max(0,best.miles-r.miles),
      pendingMin: !!r.blockedByMin};
  }
  return {res,usage,totals};

/* Pool status for a reference date */
function poolStatus(state,refDate){

const DATA_VERSION=4;
function migrateState(s){

    if(t.channel==='instore' && !t.pay && t.src==='card') t.pay=(t.wallet===false?'tap':'wallet');
    t.amount=+t.amount||0;
  }
  s.settings=s.settings||{};
  if(s.settings.kf===undefined) s.settings.kf=true;
  if(!Array.isArray(s.settings.excludeCats)) s.settings.excludeCats=['savings'];
  if(!s.settings.budgets||typeof s.settings.budgets!=='object') s.settings.budgets={};
  if(!Array.isArray(s.recurring)) s.recurring=[];
  // v4: onboarding, theme, remembered Add choices, statement-date confirmation, editable content overrides
  if(s.settings.onboarded===undefined) s.settings.onboarded=!!(s.txs.length||(Array.isArray(s.cards)&&s.cards.some(c=>c.held)));
  if(!['auto','light','dark'].includes(s.settings.theme)) s.settings.theme='auto';
  if(!s.settings.last||typeof s.settings.last!=='object') s.settings.last={};
  if(s.settings.saveHints===undefined) s.settings.saveHints=true;
  if(!s.content||typeof s.content!=='object') s.content={};
  if(Array.isArray(s.cards)) for(const c of s.cards){ if(c.cycle==='statement'&&c.stmtSet===undefined) c.stmtSet=(+c.stmtDay||1)!==1; }

/* ===== Recurring monthly entries ===== */
function ymAdd(ym,k){ let [y,m]=ym.split('-').map(Number); m+=k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+pad(m); }
function dateInMonth(ym,day){ const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate(); return ym+'-'+pad(Math.min(day,last)); }
/* adds one entry per missed month (lastMonth+1 .. current month) for each active template; returns # added */
function applyRecurring(state,todayYmd){
  const cur=todayYmd.slice(0,7); let n=0;
  for(const r of state.recurring||[]){
    if(!r.active) continue;
    let ym=ymAdd(r.lastMonth,1);
    while(ym<=cur){
      const date=dateInMonth(ym,r.day);
      if(!state.txs.some(t=>t.recurId===r.id && (t.date||'').slice(0,7)===ym)){ // added on first open of the month (even if its day is later in the month - edit/delete freely)
        state.txs.push({id:'r'+r.id+'_'+ym,ts:Date.now()+n,date,amount:r.amount,cat:r.cat,src:r.src,card:r.src==='card'?r.card:null,
          channel:r.channel||'online',pay:r.pay,merchant:r.merchant||'',fcy:false,recurId:r.id,auto:true});
        n++;
      }
      r.lastMonth=ym; ym=ymAdd(ym,1);
    }
  }
  return n;
}

/* ===== Expense summary across all payment sources ===== */
function srcKey(t){ return isCardTx(t)?'card:'+(t.card||'?'):t.src; }
function monthTotals(state,ym){
  const ex=new Set(state.settings&&state.settings.excludeCats||[]);
  const o={total:0,excluded:0,byCat:{},bySrc:{},count:0,excludedByCat:{}};
  for(const t of state.txs){ if(t.date.slice(0,7)!==ym) continue; const a=+t.amount||0;
    if(ex.has(t.cat)){ o.excluded+=a; o.excludedByCat[t.cat]=(o.excludedByCat[t.cat]||0)+a; continue; }
    o.total+=a; o.count++; o.byCat[t.cat]=(o.byCat[t.cat]||0)+a; const k=srcKey(t); o.bySrc[k]=(o.bySrc[k]||0)+a; }
  return o;
}
function expenseSummary(state,ym){
  const cur=monthTotals(state,ym), prev=monthTotals(state,ymAdd(ym,-1));
  const budgets=(state.settings&&state.settings.budgets)||{};
  const cats=[...new Set([...Object.keys(cur.byCat),...Object.keys(prev.byCat),...Object.keys(budgets).filter(k=>budgets[k]>0)])]
    .filter(c=>!(state.settings.excludeCats||[]).includes(c));
  const rows=cats.map(c=>{ const a=cur.byCat[c]||0, p=prev.byCat[c]||0, b=+budgets[c]||0;
    return {cat:c,amount:a,pct:cur.total?a/cur.total:0,prev:p,diff:a-p,budget:b,remaining:b?b-a:null,budgetPct:b?a/b:null}; })
    .sort((x,y)=>y.amount-x.amount||y.budget-x.budget);
  const trend=[]; for(let k=5;k>=0;k--){ const m=ymAdd(ym,-k); trend.push({ym:m,total:monthTotals(state,m).total}); }
  // miles only over card spend
  return {ym,total:cur.total,prevTotal:prev.total,excluded:cur.excluded,excludedByCat:cur.excludedByCat,count:cur.count,rows,bySrc:cur.bySrc,trend};
}
/* card-only stats for a month (effective mpd & missed ignore non-card spend) */
function cardMonthStats(state,ym,L){
  L=L||evalLedger(state); let spend=0,miles=0,missed=0;
  for(const t of state.txs){ if(t.date.slice(0,7)!==ym||!isCardTx(t)) continue; const r=L.res[t.id]||{}; spend+=+t.amount; miles+=r.miles||0; missed+=r.missed||0; }
  return {spend,miles,missed,mpd:spend?miles/spend:0};
}

function _cardShort(n){return String(n||'').replace(/\s*\(.*?\)\s*/g,' ').trim();}
function _money(x){return 'S$'+Math.round(+x).toLocaleString('en-SG');}
function _daysIn(ym){const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate();}
/* month-end projection: transfers/PayNow/repeating entries are fixed; card & cash spend is extrapolated by day */
function _projected(state,ym,day,dim,ex){ let fixed=0,vari=0; for(const t of state.txs){ if(t.date.slice(0,7)!==ym||ex.has(t.cat)) continue; if(t.recurId||t.src==='bank'||t.src==='paynow'||(CAT[t.cat]||{}).nc) fixed+=+t.amount; else vari+=+t.amount; } return fixed+vari/day*dim; }
function merchantKey(t){ return String(t.merchant||'').replace(/\[DEMO\]\s*/i,'').trim(); }
function _nextDay(d){ const x=parseD(d); x.setDate(x.getDate()+1); return ymd(x); }
function _fmtD(d){ const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return (+d.slice(8))+' '+M[+d.slice(5,7)-1]; }

/* insights(state, ym, todayStr) -> {summary, catTrend, merchants, opportunities} */
function insights(state,ym,todayStr){
  todayStr=todayStr||ymd(new Date());
  const L=evalLedger(state); const E=expenseSummary(state,ym); const cs=cardMonthStats(state,ym,L);
  const ex=new Set(state.settings.excludeCats||[]);
  const isCur=todayStr.slice(0,7)===ym; const dim=_daysIn(ym); const day=isCur?Math.max(1,+todayStr.slice(8)):dim;
  const budgets=state.settings.budgets||{}; const btot=Object.values(budgets).reduce((a,b)=>a+(+b||0),0);
  const bused=E.rows.filter(r=>r.budget>0).reduce((a,r)=>a+r.amount,0);
  const summary={ym,total:E.total,prev:E.prevTotal,diff:E.total-E.prevTotal,diffPct:E.prevTotal?(E.total-E.prevTotal)/E.prevTotal:null,
    miles:cs.miles,cardSpend:cs.spend,mpd:cs.mpd,missed:cs.missed,count:E.count,excluded:E.excluded,budgetTotal:btot,budgetUsed:bused,
    projected:isCur&&day<dim?_projected(state,ym,day,dim,ex):E.total,dayOfMonth:day,daysInMonth:dim,isCurrent:isCur};
  // per-category trend: this month, last month, 3-month average before this month
  const hist=[1,2,3].map(k=>monthTotals(state,ymAdd(ym,-k)).byCat);
  const catTrend=E.rows.map(r=>{ const avg3=(hist.reduce((a,h)=>a+(h[r.cat]||0),0))/3; const months=hist.filter(h=>h[r.cat]).length;
    return {...r,avg3,months,vsAvg:avg3?(r.amount-avg3)/avg3:null}; });
  // top merchants
  const mm={}; for(const t of state.txs){ if(t.date.slice(0,7)!==ym||ex.has(t.cat)) continue; const k=merchantKey(t)||((CAT[t.cat]||{}).name||t.cat); const o=mm[k.toLowerCase()]=mm[k.toLowerCase()]||{name:k,amount:0,count:0,cat:t.cat}; o.amount+=+t.amount; o.count++; }
  const merchants=Object.values(mm).sort((a,b)=>b.amount-a.amount).slice(0,5);
  const opp=[];
  // 1. budgets: over, or on pace to go over
  for(const r of E.rows.filter(r=>r.budget>0)){
    const proj=isCur?r.amount/day*dim:r.amount;
    if(r.amount>r.budget) opp.push({kind:'budget',sev:3,icon:'🔴',cat:r.cat,title:`${(CAT[r.cat]||{name:r.cat}).name} is ${_money(r.amount-r.budget)} over budget`,detail:`${_money(r.amount)} spent vs ${_money(r.budget)} budget.`,value:r.amount-r.budget});
    else if(isCur&&day>=5&&proj>r.budget*1.05) opp.push({kind:'budget',sev:2,icon:'🟠',cat:r.cat,title:`${(CAT[r.cat]||{name:r.cat}).name} on pace to exceed budget`,detail:`At this pace ≈${_money(proj)} by month end vs ${_money(r.budget)}.`,value:proj-r.budget});
  }
  // 2. wrong card: miles missed
  const missedTx=state.txs.filter(t=>t.date.slice(0,7)===ym&&isCardTx(t)&&(L.res[t.id]||{}).missed>0).sort((a,b)=>L.res[b.id].missed-L.res[a.id].missed);
  if(missedTx.length){ const tot=missedTx.reduce((a,t)=>a+L.res[t.id].missed,0); const t=missedTx[0]; const opt=state.cards.find(c=>c.id===L.res[t.id].optimal);
    opp.push({kind:'card',sev:2,icon:'💳',title:`${Math.round(tot).toLocaleString('en-SG')} miles missed on ${missedTx.length} purchase${missedTx.length>1?'s':''}`,detail:`Biggest: ${merchantKey(t)||CAT[t.cat].name} ${_money(t.amount)} - ${opt?_cardShort(opt.name):'another card'} would have earned ${Math.round(L.res[t.id].missed)} more miles${opt&&Object.values(opt.pools||{}).some(p=>p.min)?' (only once its minimum spend for that month is met)':''}.`,value:tot,miles:tot}); }
  // 3. recurring / subscriptions
  const subs=[]; const seen=new Set();
  for(const r of (state.recurring||[]).filter(r=>r.active&&!ex.has(r.cat))){ subs.push({name:r.merchant||CAT[r.cat].name,amount:+r.amount}); seen.add(String(r.merchant||'').toLowerCase()); }
  const prevM=[ymAdd(ym,-1),ymAdd(ym,-2)];
  for(const m of merchants.concat(Object.values(mm))){ const k=m.name.toLowerCase(); if(seen.has(k)||m.count!==1) continue;
    const same=prevM.filter(pm=>state.txs.some(t=>t.date.slice(0,7)===pm&&merchantKey(t).toLowerCase()===k&&Math.abs(+t.amount-m.amount)<=Math.max(1,m.amount*0.1)));
    if(same.length>=1&&['entertainment','bills','others','shopping','insurance'].includes(m.cat)){ subs.push({name:m.name,amount:m.amount}); seen.add(k); } }
  if(subs.length){ const tot=subs.reduce((a,s)=>a+s.amount,0); opp.push({kind:'subs',sev:1,icon:'🔁',title:`${subs.length} recurring charge${subs.length>1?'s':''}: ${_money(tot)}/month`,detail:subs.slice(0,5).map(s=>`${s.name} ${_money(s.amount)}`).join(' · ')+'. Cancel any you no longer use.',value:tot*12}); }
  // 4. food delivery vs dining
  const din=state.txs.filter(t=>t.date.slice(0,7)===ym&&t.cat==='dining'&&!ex.has('dining')); const dTot=din.reduce((a,t)=>a+(+t.amount),0);
  const del=din.filter(t=>DELIVERY_RE.test(t.merchant||'')).reduce((a,t)=>a+(+t.amount),0);
  if(del>=50&&dTot>0) opp.push({kind:'delivery',sev:del/dTot>0.4?2:1,icon:'🛵',title:`Food delivery ${_money(del)} (${Math.round(del/dTot*100)}% of dining)`,detail:'Delivery fees and menu mark-ups add up. Pick up / dine in, or buy Grab/foodpanda vouchers on HeyMax and pay with a 4 mpd card.',value:del});
  // 5. non-card spend that a card could have earned on
  const ncTx=state.txs.filter(t=>t.date.slice(0,7)===ym&&!isCardTx(t)&&!NOBONUS_CATS.includes(t.cat)&&!ex.has(t.cat)&&!(CAT[t.cat]||{}).nc);
  const ncAmt=ncTx.reduce((a,t)=>a+(+t.amount),0);
  if(ncAmt>=50&&state.cards.some(c=>c.held)){ let mi=0; for(const t of ncTx){ const r=recommend(state,{amount:+t.amount,cat:t.cat,channel:CAT[t.cat].ch,pay:'wallet',fcy:false,merchant:t.merchant||'',date:t.date}); mi+=(r.list[0]||{miles:0}).miles; }
    if(mi>0) opp.push({kind:'cash',sev:1,icon:'💵',title:`${_money(ncAmt)} paid by cash/PayNow/transfer`,detail:`Where a card is accepted, the best card would have earned ≈${Math.round(mi).toLocaleString('en-SG')} miles.`,value:mi,miles:mi}); }
  // 6. rebate-app opportunities for the top categories with spend
  const C=state.content||{}; const BYCAT={...SAVE_BY_CAT,...(C.byCat||{})}; const APPS=Array.isArray(C.apps)?C.apps:SAVE_APPS;
  const top=E.rows.filter(r=>r.amount>=50&&BYCAT[r.cat]).slice(0,3);
  for(const r of top){ const s=BYCAT[r.cat]; const app=APPS.find(a=>a.id===(s.apps||[])[0]);
    opp.push({kind:'app',sev:0,icon:app?app.icon:'💡',cat:r.cat,app:app&&app.id,title:`${(CAT[r.cat]||{}).name}: ${_money(r.amount)} - stack ${app?app.name:'an app'}`,detail:s.tip,value:r.amount*0.01}); }
  opp.sort((a,b)=>b.sev-a.sev||b.value-a.value);
  return {summary,catTrend,merchants,opportunities:opp,expense:E};
}

/* nudges(state, todayStr) -> [{sev, icon, text, card, action}] for the home screen */
function nudges(state,todayStr){
  todayStr=todayStr||ymd(new Date()); const out=[]; const held=state.cards.filter(c=>c.held);
  if(!held.length) return [{sev:3,icon:'💳',text:'Tick the cards you hold to get recommendations.',action:'cards'}];
  // statement dates not confirmed
  for(const c of held.filter(c=>c.cycle==='statement'&&!c.stmtSet)) out.push({sev:2,icon:'📅',card:c.id,text:`Set the statement date for ${_cardShort(c.name)} - its cap resets per statement month.`,action:'cards'});
  const ps=poolStatus(state,todayStr);
  for(const p of ps){ const nm=_cardShort(p.card.name)+(ps.filter(x=>x.card.id===p.card.id).length>1?' · '+p.name:'');
    const reset=_fmtD(_nextDay(p.cycleEnd));
    if(p.min&&p.minSpent>0&&p.minSpent<p.min){ out.push({sev:2,icon:'⏳',card:p.card.id,pid:p.pid,text:`${nm}: ${_money(p.min-p.minSpent)} short of the ${_money(p.min)} minimum - bonus pending (resets ${reset}).`}); continue; }
    if(p.min&&!p.minSpent) continue; // unused min-spend bucket: stay quiet
    if(p.pct>=1) out.push({sev:2,icon:'⛔',card:p.card.id,pid:p.pid,text:`${nm}: 4 mpd cap used up until ${reset}.`,action:'miles'});
    else if(p.used>0) out.push({sev:p.pct>=0.75?2:1,icon:p.pct>=0.75?'⚠️':'✅',card:p.card.id,pid:p.pid,text:`${nm}: ${_money(p.remaining)} left at bonus rate (resets ${reset}).`,pct:p.pct});
    else out.push({sev:0,icon:'🟢',card:p.card.id,pid:p.pid,text:`${nm}: full ${_money(p.cap)} bonus cap available (resets ${reset}).`,pct:0});
  }
  for(const m of cardMinStatus(state,todayStr)) if(m.spent>0&&m.spent<m.min) out.push({sev:2,icon:'⏳',card:m.card.id,text:`${_cardShort(m.card.name)}: ${_money(m.min-m.spent)} short of the ${_money(m.min)} minimum spend.`});
  // fee month reminders (this month or next)
  const mo=+todayStr.slice(5,7); const nx=mo%12+1; const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(const c of held.filter(c=>c.feeMonth)) if(+c.feeMonth===mo||+c.feeMonth===nx) out.push({sev:2,icon:'💰',card:c.id,text:`${_cardShort(c.name)} annual fee due ${MN[c.feeMonth-1]}: call for a waiver${c.id==='citi_prestige'?' or decide whether to cancel (transfer ThankYou points first)':''}.`,action:'playbook'});
  // DBS points expiry: quarter-end reminder
  if(held.some(c=>c.id==='dbs_wwmc')&&[3,6,9,12].includes(mo)&&+todayStr.slice(8)>=15) out.push({sev:1,icon:'⌛',card:'dbs_wwmc',text:'DBS Points expire at quarter end (12-15 months after earning) - convert if you have 5,000+.'});
  // budget pace
  const ym=todayStr.slice(0,7); const dim=_daysIn(ym), day=+todayStr.slice(8); const E=expenseSummary(state,ym);
  for(const r of E.rows.filter(r=>r.budget>0)){ if(r.amount>r.budget) out.push({sev:2,icon:'🔴',text:`${CAT[r.cat].name} is ${_money(r.amount-r.budget)} over its ${_money(r.budget)} budget.`,action:'spend'});
    else if(r.budgetPct>=0.8) out.push({sev:1,icon:'🟠',text:`${CAT[r.cat].name}: ${_money(r.budget-r.amount)} of budget left for ${dim-day} more days.`,action:'spend'}); }
  // dated promos
  for(const p of PROMOS) if(todayStr>=p.from&&todayStr<=p.until&&(!p.cats||state.txs.some(t=>p.cats.includes(t.cat)&&t.date>=ymAdd(ym,-2)))) out.push({sev:0,icon:p.icon,text:p.text,src:p.src,promo:p.id});
  return out.sort((a,b)=>b.sev-a.sev);
}

function frequentMerchants(n){ const since=ymd(new Date(Date.now()-120*864e5)); const m={};
  for(const t of S.txs){ if(t.date<since) continue; const k=merchantKey(t); if(!k) continue; const kk=k.toLowerCase(); const o=m[kk]=m[kk]||{name:k,count:0,last:t}; o.count++; if(t.date>=o.last.date) o.last=t; }
  return Object.values(m).filter(x=>x.count>=2||x.last.recurId).sort((a,b)=>b.count-a.count||(b.last.date>a.last.date?1:-1)).slice(0,n||6); }
function quickAdd(name){ const f=frequentMerchants(20).find(x=>x.name===name); if(!f) return; const t=f.last; editingId=null;
  draft={...freshDraft(),src:t.src||'card',cat:t.cat,channel:t.channel||CAT[t.cat].ch,pay:t.pay||'wallet',inApp:!!t.inApp,fcy:!!t.fcy,sea:!!t.sea,merchant:merchantKey(t),amount:'',catTouched:true}; pickedCard=null; pickedManual=false; setView('add'); setTimeout(()=>{const a=$('#amt'); if(a){a.placeholder=(+t.amount).toFixed(2); a.focus();}},50); }

   ${rest.length?`<details><summary>${rest.length} more (caps still free, promos)</summary>${rest.map(nudgeHtml).join('')}</details>`:''}</div>`; }

function hintHtml(h){ return `<div class="hint">💡 <b>Save more on ${esc(catName(h.cat))}:</b> ${esc(h.tip)}
  <div><button class="link" onclick="saveCat='${h.cat}';setView('save')">Apps & how-to →</button><button class="link" onclick="lastHint=null;render()">Dismiss</button><button class="link" onclick="S.settings.saveHints=false;save();lastHint=null;render();toast('Tips after saving turned off (More → Settings)')">Don't show</button></div></div>`; }
function merchantGuess(v){ draft.merchant=v; if(draft.catTouched) return updateReco(); const g=guessCat(v); if(g&&g!==draft.cat){ if(CAT[g].nc&&!isNC()){ updateReco(); return; } draft.cat=g; if(!editingId) draft.channel=CAT[g].ch; render(); toast('Category set to '+catName(g)+' - tap another to change'); } else updateReco(); }
function setSrc(v){ pickedManual=false; draft.src=v; const c=draft.cat, nc=CAT[c].nc;
  if(v!=='card'&&!editingId&&!nc){ if(v==='bank') draft.cat='rent'; else if(v==='paynow'&&!['dining','groceries','others'].includes(c)) draft.cat='family'; else if(['fcy','contactless'].includes(c)) draft.cat='others'; }
  if(v==='card'&&nc) draft.cat='dining'; render(); }
function setCat(c){ pickedManual=false; draft.cat=c; draft.catTouched=true; const def=CAT[c].ch; if(!editingId) draft.channel=def; if(c==='fcy') draft.fcy=true; render(); }
function draftTx(){ if(isNC()) return {src:draft.src,amount:+draft.amount||0,cat:draft.cat,channel:'online',fcy:false,merchant:draft.merchant,date:draft.date,card:null};
  const f=!!draft.fcy||draft.cat==='fcy'; const {catTouched,...dd}=draft; return {...dd,amount:+draft.amount||0,fcy:f,sea:f&&!!draft.sea,inApp:draft.channel==='online'&&!!draft.inApp,pay:draft.channel==='instore'?draft.pay:undefined}; }
function updateReco(){
  const box=$('#reco'); if(!box) return; const d=draftTx();
  if(isNC()){ const sv=SRC[draft.src]; box.innerHTML=`<div class="card nc"><div class="h3">${sv.icon} ${esc(sv.name)}</div><div class="sub">Earns 0 miles. Not counted in card caps, minimum spend, effective mpd or "miles missed" - it only shows in <b>Expenses</b>.${(S.settings.excludeCats||[]).includes(d.cat)?' This category is excluded from expense totals (change in More → Backup & settings).':''}</div></div>`;
    const bl=$('#bestline'); if(bl) bl.innerHTML=''; const b=$('#saveBtn'); if(b) b.textContent=(editingId?'Update':'Save')+(d.amount>0?` ${money(d.amount)} via ${sv.name}`:''); return; }
  if(!held().length){box.innerHTML='';return;}
  const amt=d.amount>0?d.amount:100;
  const r=recommend(S,{...d,amount:amt},editingId);
  if(!pickedManual || !pickedCard || !held().some(c=>c.id===pickedCard)) pickedCard=r.list[0]&&r.list[0].card.id;
  const minWarn=x=>{ const c=x.card; if(!c.min && !Object.values(c.pools||{}).some(p=>p.min)) return '';
     return c.assumeMin===false?`<div class="warn">Min spend not assumed - bonus only once actual spend reaches it.</div>`:`<div class="warn">Assumes you'll meet the min spend${c.min?' (S$'+c.min+'/'+(c.cycle==='statement'?'statement':'calendar')+' month)':' (S$1,000 per category per statement month)'}.</div>`; };
  const BADGE={bonus:['ok',''],partial:['amber','Partial cap'],capped:['red','Cap reached'],minspend:['red','Min spend not met'],ineligible:['grey','Not eligible'],base:['grey','Base rate']};
  const row=(x,i)=>{ const bd=BADGE[x.status]||['','']; const dim=['capped','minspend','ineligible'].includes(x.status)||(x.status==='base'&&i>0);
    return `<label class="opt ${pickedCard===x.card.id?'sel':''} ${dim?'dim':''}">
       <input type="radio" name="pc" ${pickedCard===x.card.id?'checked':''} onchange="pickedCard='${x.card.id}';pickedManual=true;updateReco()">
       <div class="grow"><div><b>${esc(short(x.card.name))}</b> ${i===0?'<span class="tag">BEST</span>':''} ${bd[1]&&!(i===0&&x.status==='base')?`<span class="badge ${bd[0]}">${bd[1]}</span>`:''}</div>
       <div class="sub">${x.parts.map(p=>`S$${fmt(p.amt)} @ ${p.mpd} mpd${p.label!=='Base rate'?' ('+esc(p.label)+')':' (base)'}`).join(' + ')||'0 miles (excluded)'}${x.fee?` · ⚠️ Amaze fee ~${money(x.fee)}`:''}</div>
       ${x.reason&&x.status!=='bonus'?`<div class="why ${bd[0]}">${esc(x.reason)}</div>`:''}
       ${x.status==='bonus'||x.status==='partial'?minWarn(x):''}</div>
       <div class="miles">${n0(x.miles)}<small> mi</small><br><small>${(x.miles/amt).toFixed(2)} mpd</small></div></label>`; };
  const sp=r.split;
  box.innerHTML=`<div class="card">
    <div class="h3">${d.amount>0?'Card ranking':'Card ranking <small>for S$100 - enter amount</small>'}</div>
    ${r.msg?`<div class="note">💡 ${esc(r.msg.split(' If the merchant')[0])}</div>`:''}
    ${sp?`<div class="split"><div class="h3">✂️ Recommended split (straddles a cap)</div>
       <div class="kv"><span>${money(sp.amtA)} on <b>${esc(short(sp.a.name))}</b></span><span>${n0(sp.milesA)} mi</span></div>
       <div class="kv"><span>${money(sp.amtB)} on <b>${esc(short(sp.b.name))}</b></span><span>${n0(sp.milesB)} mi</span></div>
       <div class="kv"><span>Total vs ${n0(r.list[0].miles)} on one card</span><b>${n0(sp.miles)} mi</b></div>
       <div class="sub">Only if the merchant lets you split the bill. Save it as two transactions.</div></div>`:''}
    ${(()=>{ const bl=r.blocked||[]; const ord=[r.list[0],...r.list.filter(x=>bl.includes(x.card.id)),...r.list.slice(1).filter(x=>!bl.includes(x.card.id))];
      const nTop=Math.max(2,1+bl.length); return ord.slice(0,nTop).map((x,i)=>row(x,i)).join('')+(ord.length>nTop?`<details><summary>Compare all ${ord.length} cards</summary>${ord.slice(nTop).map((x,i)=>row(x,i+nTop)).join('')}</details>`:''); })()}
  </div>`;
  const bl=$('#bestline'); if(bl&&r.list[0]) bl.innerHTML=`🏆 Use <b>${esc(short(r.list[0].card.name))}</b> → ${n0(r.list[0].miles)} miles (${(r.list[0].miles/amt).toFixed(1)} mpd)${r.split?' · or split, see below':r.msg?' · see note below':''}`;
  const sel=r.list.find(x=>x.card.id===pickedCard); const b=$('#saveBtn');
  if(b) b.textContent=(editingId?'Update':'Save')+(sel?` ${d.amount>0?money(d.amount)+' ':''}on ${short(sel.card.name)}${d.amount>0?` (+${n0(sel.miles)} mi)`:''}`:'');
}
let saveCat=null;
function saveTx(){
  const d=draftTx(); if(!(d.amount>0)){ const a=$('#amt'); if(a&&a.placeholder&&a.placeholder!=='0.00'){ draft.amount=a.placeholder; return saveTx(); } return toast('Enter an amount'); }
  const nc=isNC(); if(!nc && !pickedCard) return toast('Tick your cards first (More → Cards)');
  const rec={...d,src:nc?draft.src:'card',card:nc?null:pickedCard};
  let t; const wasEdit=!!editingId;
  if(editingId){ t=S.txs.find(t=>t.id===editingId); const keep={id:t.id,ts:t.ts,recurId:t.recurId,auto:t.auto,demo:t.demo};
    Object.keys(t).forEach(k=>delete t[k]); Object.assign(t,rec,keep); Object.keys(t).forEach(k=>t[k]===undefined&&delete t[k]); editingId=null; }
  else { t={...rec,id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now()}; S.txs.push(t); }
  syncRecurring(t,!!draft.repeat);
  S.settings.last={src:rec.src,cat:rec.cat,channel:draft.channel,pay:draft.pay};
  save(); const keepDate=draft.date; const c=cardById(t.card);
  const H=content().byCat[t.cat]; lastHint=(!wasEdit&&S.settings.saveHints!==false&&H&&H.tip)?{cat:t.cat,tip:H.tip}:null;
  draft=freshDraft(); if(keepDate!==today()) draft.date=keepDate; pickedCard=null; pickedManual=false; showAllCats=false;
  if(wasEdit){ toast('Updated'); setView('spend'); return; }
  const id=t.id; toast(`Saved ${money(t.amount)}${c?' on '+short(c.name):''} ✓`,'Undo',()=>{ S.txs=S.txs.filter(x=>x.id!==id); save(); render(); toast('Removed'); });
  render(); window.scrollTo(0,0);
}

/* ---------- Data & settings ---------- */
function setTheme(t){ S.settings.theme=t; save(); applyTheme(); render(); }
/* repeat-monthly templates live in S.recurring; each auto-added entry is a normal, editable transaction */
function syncRecurring(t,on){
  let r=t.recurId&&S.recurring.find(x=>x.id===t.recurId);
  if(on){
    const f={amount:+t.amount,cat:t.cat,src:t.src||'card',card:t.card||null,channel:t.channel,pay:t.pay,merchant:t.merchant||'',day:+t.date.slice(8)};
    if(r){ Object.assign(r,f,{active:true}); }
    else { r={id:'rc'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),...f,active:true,lastMonth:[t.date.slice(0,7),today().slice(0,7)].sort().pop()}; S.recurring.push(r); t.recurId=r.id; }
  } else if(r){ r.active=false; }
}
function stopRecurring(id){ const r=S.recurring.find(x=>x.id===id); if(r){ r.active=false; save(); render(); toast('Stopped repeating'); } }
function editTx(id){ const t=S.txs.find(t=>t.id===id); if(!t) return; editingId=id; const rr=t.recurId&&S.recurring.find(x=>x.id===t.recurId); draft={src:t.src||'card',repeat:!!(rr&&rr.active),amount:t.amount,cat:t.cat,channel:t.channel||'online',pay:t.pay||(t.wallet===false?'tap':'wallet'),inApp:!!t.inApp,fcy:!!t.fcy,sea:!!t.sea,merchant:t.merchant||'',date:t.date,catTouched:true}; pickedCard=t.card; pickedManual=true; lastHint=null; setView('add'); }
function cancelEdit(){ editingId=null; draft=freshDraft(); pickedCard=null; pickedManual=false; setView('spend'); }
function delTx(id){ const k=S.txs.findIndex(x=>x.id===id); if(k<0) return; const t=S.txs[k]; S.txs.splice(k,1);
  const r=t.recurId&&S.recurring.find(x=>x.id===t.recurId); if(r&&r.active&&confirm('This entry repeats monthly. Stop repeating it too? (Cancel = keep repeating)')) r.active=false;
  save(); render(); toast('Deleted','Undo',()=>{ S.txs.splice(Math.min(k,S.txs.length),0,t); save(); render(); toast('Restored'); }); }

/* ---------- Month ---------- */
function shiftMonth(k){ let [y,m]=viewMonth.split('-').map(Number); m+=k; if(m<1){m=12;y--;} if(m>12){m=1;y++;} viewMonth=y+'-'+pad(m); render(); }
function refDateForMonth(){ const t=today(); if(t.slice(0,7)===viewMonth) return t; const [y,m]=viewMonth.split('-').map(Number); return ymd(new Date(y,m,0)); }
function switchTarget(ps){
  const rule=(ps.card.rules||[]).find(r=>(r.pools||[]).includes(ps.pid)) || (S.cards.find(c=>(c.rules||[]).some(r=>(r.pools||[]).includes(ps.pid)))||{rules:[]}).rules.find(r=>(r.pools||[]).includes(ps.pid));
  if(!rule) return null; let cats=ruleCats(rule,ps.card); const labels={};
  if(cats==='all'){ const c0=rule.fcy==='fcy'?'fcy':rule.channel==='online'?'shopping':'contactless'; cats=[c0]; labels[c0]=rule.fcy==='fcy'?'FCY spend':rule.channel==='online'?'online spend':'in-store tap'; }
  const out=[];
  for(const cat of cats.slice(0,3)){
    const ch=rule.channel==='any'?CAT[cat].ch:rule.channel;
    const r=recommend(S,{amount:100,cat,channel:ch,pay:'wallet',fcy:rule.fcy==='fcy'||cat==='fcy',merchant:'',date:refDateForMonth()});
    const alt=r.list.find(x=>x.card.id!==ps.card.id && !(x.parts||[]).some(p=>(rule.pools||[]).length && p.label===ruleLabel(rule,ps.card)));
    if(alt) out.push({cat,alt,ch,label:labels[cat]||CAT[cat].name});
  }
  return out;
}

  ${pools.length?pools.map(p=>{ const pct=Math.min(1,p.pct); const cls=p.pct>=1?'red':p.pct>=0.75?'amber':'green';
     let msg=''; if(p.pct>=0.75){ const st=switchTarget(p)||[]; const sw=st.map(x=>`<b>${esc(short(x.alt.card.name))}</b> for ${esc(x.label)} (${(x.alt.miles/100).toFixed(1)} mpd)`).join('; ');
       msg = p.pct>=1? `<div class="capmsg red">⛔ Cap reached${sw?', switch to '+sw:''}.</div>` : `<div class="capmsg amber">⚠️ Only ${money(p.remaining)} left${sw?'. Next: '+sw:''}.</div>`; }

  ${mins.map(x=>`<div class="cap"><div class="caphead"><span>${esc(short(x.card.name))} · minimum spend</span><span>${money(x.spent)} / ${money(x.min)}</span></div><div class="bar"><i class="${x.spent>=x.min?'green':'amber'}" style="width:${Math.min(100,x.spent/x.min*100).toFixed(1)}%"></i></div>${x.spent<x.min?`<div class="sub">${money(x.min-x.spent)} more needed this cycle to unlock bonus miles.</div>`:''}</div>`).join('')}
  </div>
  ${Object.keys(byCard).length?`<div class="card"><div class="h3">By card</div>${Object.entries(byCard).sort((a,b)=>b[1].m-a[1].m).map(([id,v])=>`<div class="kv"><span>${esc(short((cardById(id)||{name:id}).name))}</span><span>${money(v.s)} · <b>${n0(v.m)} mi</b></span></div>`).join('')}

  <div class="card"><div class="h3">Backup</div>
   <div class="btnrow"><button class="primary" onclick="exportJson()">⬇️ Export JSON</button><button onclick="$('#imp').click()">⬆️ Import JSON</button></div>
   <input id="imp" type="file" accept="application/json,.json" style="display:none" onchange="importFile(this.files[0])">
   <div class="sub">Data lives only in this browser (localStorage). Export regularly, especially before clearing browser data or switching phones.</div></div>
  <div class="card"><div class="h3">Demo</div>
   <div class="btnrow"><button onclick="loadDemo()">Load demo data</button><button onclick="clearDemo()">Remove demo transactions</button><button class="danger" onclick="clearAll()">Delete ALL transactions</button></div>
   <div class="sub">Demo adds about 3 months of sample transactions (incl. rent by bank transfer, PayNow, cash; merchants marked "[DEMO]"), and ticks your cards / sample budgets if none are set. "Remove demo transactions" deletes only those.</div></div>
  <div class="card"><div class="h3">Settings</div>
   <label class="tog"><input type="checkbox" ${S.settings.kf!==false?'checked':''} onchange="setKf(this.checked)"> Count miles as <b>KrisFlyer</b> miles (HSBC converts 25,000 pts → 10,000 KF, so 4 mpd → 3.33 KF mpd; other cards convert 1:1)</label></div>
  <div class="card"><div class="h3">Expenses settings</div>
   <div class="sub">Categories <b>excluded</b> from expense totals (still logged):</div>
   ${CATS.filter(c=>c.nc||['insurance','bills'].includes(c.id)).map(c=>`<label class="tog"><input type="checkbox" ${(S.settings.excludeCats||[]).includes(c.id)?'checked':''} onchange="toggleExcl('${c.id}',this.checked)"> ${c.icon} ${esc(c.name)}</label>`).join('')}
   <div class="h3" style="margin-top:10px">🔁 Repeating monthly</div>
   ${S.recurring.filter(r=>r.active).length?S.recurring.filter(r=>r.active).map(r=>`<div class="kv"><span>${esc(r.merchant||CAT[r.cat].name)} · ${money(r.amount)} · day ${r.day} · ${esc(r.src==='card'?short((cardById(r.card)||{name:'card'}).name):SRC[r.src].name)}</span><button class="link" onclick="stopRecurring('${r.id}')">Stop</button></div>`).join(''):'<div class="sub">None. Tick "Repeat monthly" when adding an entry (e.g. rent).</div>'}
   <div class="sub">A repeating entry is added automatically the first time you open the app in a new month. Each one is a normal transaction you can edit or delete.</div></div>
  <div class="card"><div class="h3">How miles are calculated (assumptions)</div><ul class="sub">
   <li>Each card has bonus rules (category, online/in-store, payment method, SGD/FCY, merchant keywords) and cap pools. A purchase uses the highest-mpd rule whose cap still has room. Overflow goes to the base rate, and the app suggests a split when that earns more.</li>
   <li><b>Gates:</b> a card is greyed out with a reason when its cap is used up ("Cap reached"), its minimum spend isn't met ("Min spend not met"), or the purchase doesn't qualify ("Not eligible", e.g. a physical card tap on UOB PPV, an in-app Apple Pay payment on Citi Rewards, fast food on HSBC Revolution, Agoda/Expedia on HSBC, streaming on Lady's Entertainment).</li>
   <li>Bonus mpd is the total rate (base + bonus). Earning blocks: UOB rounds down to S$5, Citi/HSBC/DBS to S$1 (DBS S$5 for base). HSBC and Lady's bonus are worked out on the exact amount.</li>
   <li>Caps reset per calendar month, or per statement month from the day you set (Citi Rewards and UOB Visa Signature use statement months, so set your statement date in Cards).</li>
   <li>UOB Visa Signature needs S$1,000 per statement month in each bucket (FCY / local contactless). Logged spend only earns the bonus once the total reaches it ("pending"). Recommendations don't assume it unless you tick that option.</li>
   <li>Category ≠ MCC. Banks pay bonuses by merchant category code, and the app maps categories to typical MCCs. Bills/insurance earn no bonus (UOB/HSBC earn 0 on them).</li>
   <li>Bank transfer / PayNow / Cash entries earn 0 miles and are ignored for caps, minimum spend, recommendations, effective mpd and miles missed. They only count in Expenses.</li>
   <li>Not modelled in miles totals: welcome offers, Kris+/HeyMax/ShopBack extras (see Save more), UOB Lady's Savings boost, Citi PayAll, FCY fees (≈3.25%) and Amaze's 1% SGD fee (warning only).</li></ul></div>`;
}
function exportJson(){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='miles-tracker-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Exported'); }
function importFile(f){ if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.cards||!o.txs) throw new Error('Not a tracker backup'); if(!confirm(`Import ${o.txs.length} transactions and ${o.cards.length} cards? This replaces current data.`)) return; S=migrateState(o); setKfMode(S.settings.kf!==false); const n=applyRecurring(S,today()); save(); toast('Imported'+(n?` (+${n} recurring)`:'')); render(); }catch(e){ alert('Import failed: '+e.message); } }; rd.readAsText(f); }
function clearDemo(){ S.txs=S.txs.filter(t=>!t.demo); save(); toast('Demo removed'); render(); }
function clearAll(){ if(!confirm('Delete ALL transactions? Export a backup first if unsure.')) return; S.txs=[]; save(); render(); }

/* ---------- Expenses (all payment sources) ---------- */
function srcName(k){ if(k.startsWith('card:')){ const c=cardById(k.slice(5)); return '💳 '+(c?short(c.name):'Card'); } const x=SRC[k]; return x?x.icon+' '+x.name:k; }
function barCls(p){ return p>1?'red':p>=0.75?'amber':'green'; }
function viewExpenses(ins){
  const [y,m]=viewMonth.split('-').map(Number); const E=expenseSummary(S,viewMonth);
  const diffPct=E.prevTotal?(E.total-E.prevTotal)/E.prevTotal:null;
  const arrow=(d)=>Math.abs(d)<0.005?'<span class="sub">= last month</span>':d>0?`<span class="up">▲ ${money(d)}</span>`:`<span class="down">▼ ${money(-d)}</span>`;
  const rows=E.rows.filter(r=>r.amount>0||r.prev>0);
  const maxCat=Math.max(1,...rows.map(r=>r.amount));
  const srcs=Object.entries(E.bySrc).sort((a,b)=>b[1]-a[1]); const maxSrc=Math.max(1,...srcs.map(x=>x[1]));
  const maxT=Math.max(1,...E.trend.map(t=>t.total));
  const budgeted=E.rows.filter(r=>r.budget>0);
  const ex=S.settings.excludeCats||[];
  return `
  <div class="mswitch"><button onclick="shiftMonth(-1)">‹</button><b>${MONTHS[m-1]} ${y}</b><button onclick="shiftMonth(1)">›</button></div>
  <div class="stats">
    <div><small>Total spend</small><b>${money(E.total)}</b></div>
    <div><small>vs ${MONTHS[(m+10)%12]}</small><b class="${diffPct===null?'':diffPct>0?'red':'green'}">${diffPct===null?'–':(diffPct>0?'▲ ':'▼ ')+Math.abs(diffPct*100).toFixed(0)+'%'}</b></div>
    <div><small>Entries</small><b>${E.count}</b></div>
    <div><small>Excluded transfers</small><b>${money(E.excluded)}</b></div>
  </div>
  ${ins||''}
  <div class="card"><div class="h3">By category <small>(vs last month)</small></div>
   ${rows.length?rows.map(r=>{const c=CAT[r.cat]||{icon:'•',name:r.cat}; return `<div class="erow"><div class="ehead"><span>${c.icon} ${esc(c.name)}</span><span><b>${money(r.amount)}</b> <small>${(r.pct*100).toFixed(0)}%</small></span></div>
     <div class="bar thin"><i class="blue" style="width:${(r.amount/maxCat*100).toFixed(1)}%"></i></div><div class="sub right">${arrow(r.diff)}</div></div>`;}).join(''):'<div class="sub">No expenses this month.</div>'}
   ${E.excluded?`<div class="sub">Not counted: ${Object.entries(E.excludedByCat).map(([c,v])=>`${(CAT[c]||{icon:''}).icon} ${esc((CAT[c]||{name:c}).name)} ${money(v)}`).join(', ')} (More → Backup & settings)</div>`:''}
  </div>
  <div class="card"><div class="h3">By payment source</div>
   ${srcs.length?srcs.map(([k,v])=>`<div class="erow"><div class="ehead"><span>${esc(srcName(k))}</span><span><b>${money(v)}</b> <small>${E.total?(v/E.total*100).toFixed(0):0}%</small></span></div><div class="bar thin"><i class="${k.startsWith('card:')?'blue':'grey'}" style="width:${(v/maxSrc*100).toFixed(1)}%"></i></div></div>`).join(''):'<div class="sub">–</div>'}
  </div>
  <div class="card"><div class="h3">Budgets</div>
   ${budgeted.length?budgeted.map(r=>{const c=CAT[r.cat]||{icon:'',name:r.cat}; const p=r.budgetPct; return `<div class="cap"><div class="caphead"><span>${c.icon} ${esc(c.name)}</span><span>${money(r.amount).replace('.00','')} / ${money(r.budget).replace('.00','')}</span></div>
     <div class="bar"><i class="${barCls(p)}" style="width:${Math.min(100,p*100).toFixed(1)}%"></i></div><div class="sub ${r.remaining<0?'red':''}">${r.remaining>=0?money(r.remaining)+' left':money(-r.remaining)+' over budget'}</div></div>`;}).join(''):'<div class="sub">No budgets yet - set one below to get over-budget alerts.</div>'}
   <details ${editBudgets?'open':''} ontoggle="editBudgets=this.open"><summary>${budgeted.length?'Edit':'Set'} monthly budgets</summary>${CATS.filter(c=>!ex.includes(c.id)&&c.id!=='fcy'&&c.id!=='contactless').map(c=>`<label class="kv"><span>${c.icon} ${esc(c.name)}</span><input class="bud" type="number" inputmode="decimal" min="0" step="10" placeholder="–" value="${S.settings.budgets[c.id]||''}" onchange="setBudget('${c.id}',this.value)"></label>`).join('')}<div class="sub">Same budget every month. Leave blank for none.</div></details>
  </div>
  <div class="card"><div class="h3">6-month trend</div>
   <div class="trend">${E.trend.map(t=>`<div class="tcol ${t.ym===viewMonth?'on':''}"><small>${t.total?(t.total>=1000?(t.total/1000).toFixed(1)+'k':Math.round(t.total)):''}</small><i style="height:${(t.total/maxT*85).toFixed(1)}%"></i><span>${MONTHS[+t.ym.slice(5)-1]}</span></div>`).join('')}</div>
  </div>`;
}
function txRow(t,L){ const r=L.res[t.id]||{}; const c=cardById(t.card); const opt=cardById(r.optimal); const dt=`${esc(t.date.slice(8))} ${MONTHS[+t.date.slice(5,7)-1]}`;
  const acts=`<div class="acts"><button onclick="editTx('${t.id}')" aria-label="Edit">✏️</button><button onclick="delTx('${t.id}')" aria-label="Delete">🗑️</button></div>`;
  if(!isCardTx(t)){ const sv=SRC[t.src]||{icon:'?',name:t.src}; return `<div class="tx"><div class="grow"><div><b>${esc(merchantKey(t)||catName(t.cat))}</b> <small class="sub">${dt}</small>${t.recurId?' <small title="repeats monthly">🔁</small>':''}</div>
      <div class="sub">${catIcon(t.cat)} ${esc(catName(t.cat))} · ${sv.icon} ${esc(sv.name)}</div></div><div class="miles">${money(t.amount)}<br><small>no miles</small></div>${acts}</div>`; }
  return `<div class="tx"><div class="grow"><div><b>${esc(merchantKey(t)||catName(t.cat))}</b> <small class="sub">${dt}</small>${t.recurId?' <small title="repeats monthly">🔁</small>':''}</div>
      <div class="sub">${catIcon(t.cat)} ${esc(c?short(c.name):'?')} · ${t.channel==='online'?'online'+(t.inApp?' (in-app wallet)':''):({wallet:'phone tap',tap:'card tap',chip:'chip'}[t.pay||(t.wallet===false?'tap':'wallet')])}${t.fcy?' · FCY'+(t.sea?' (SEA)':''):''}</div>
      ${r.pendingMin?`<div class="warn">Bonus pending min spend</div>`:''}${r.missed>0&&opt?`<div class="warn">Better: ${esc(short(opt.name))} +${n0(r.missed)} mi</div>`:''}</div>
      <div class="miles">${money(t.amount)}<br><b>${n0(r.miles||0)}</b><small> mi</small></div>${acts}</div>`; }

function loadDemo(){
  const t=today(); const cur=t.slice(0,7); const dmax=+t.slice(8)||1;
  const mk=(ym,n)=>ym+'-'+pad(Math.min(n,ym===cur?dmax:28));
  const base=[ // [day, merchant, cat, channel, pay, amount, card, src]
   [1,'Rent','rent',null,null,3000,null,'bank'],[3,'Mum','family',null,null,500,null,'paynow'],[5,'Endowus','savings',null,null,1000,null,'bank'],
   [2,'Netflix','entertainment','online',null,22.98,'citi_rewards'],[2,'Spotify','entertainment','online',null,11.98,'citi_rewards'],[5,'SP Group bill','bills','online',null,98.20,'uob_prvi'],
   [2,'Din Tai Fung','dining','instore','wallet',126,'uob_lady_sol'],[3,'FairPrice','groceries','instore','wallet',142.35,'uob_ppv'],[4,'Grab ride','transport','online',null,23.80,'citi_rewards'],
   [4,'Hawker','dining',null,null,18.50,null,'cash'],[6,'GrabFood','dining','online',null,38.60,'dbs_wwmc'],[7,'Shopee','shopping','online',null,85.40,'citi_rewards'],
   [8,'Golden Village','entertainment','instore','wallet',39,'uob_lady_sol'],[9,'foodpanda','dining','online',null,32.10,'uob_prvi'],[10,'Grab ride','transport','online',null,18.20,'citi_rewards'],[11,'FairPrice','groceries','instore','wallet',96.80,'uob_ppv']];
  const extra={0:[[4,'Scoot flight','travel','online',null,420,'dbs_wwmc'],[7,'Uniqlo Tokyo','fcy','instore','tap',210,'uob_prvi'],[9,'GrabFood','dining','online',null,41.30,'dbs_wwmc']],
    1:[[12,'Lazada','shopping','online',null,160,'dbs_wwmc'],[15,'Haidilao','dining','instore','wallet',188,'uob_lady_sol'],[20,'GrabFood','dining','online',null,35,'dbs_wwmc']],
    2:[[14,'Courts','others','instore','wallet',350,'uob_ppv'],[22,'Sheng Siong','groceries','instore','wallet',88,'uob_ppv']]};
  let i=0; for(const k of [2,1,0]){ const ym=ymAdd(cur,-k);
    for(const x of [...base,...extra[k]]){ const [day,mer,cat,ch,pay,amt,card,src]=x; if(k===0&&day>dmax) continue;
      const amount=k===0?amt:Math.round(amt*(0.85+((i*37)%30)/100)*100)/100;
      S.txs.push({src:src||'card',fcy:cat==='fcy',date:mk(ym,day),merchant:'[DEMO] '+mer,cat,channel:ch||'online',...(ch==='instore'?{pay}:{}),amount:/Netflix|Spotify|Rent|Endowus|Mum/.test(mer)?amt:amount,card:card||null,id:'demo'+(i++)+Date.now().toString(36),ts:Date.now()+i,demo:true}); } }
  if(!held().length) ['citi_rewards','dbs_wwmc','hsbc_revo','uob_ppv','uob_vs','uob_lady_sol','uob_prvi','citi_prestige'].forEach(id=>{const c=cardById(id); if(c) c.held=true;});
  if(!Object.keys(S.settings.budgets).length) S.settings.budgets={dining:300,groceries:250,entertainment:80,shopping:200,transport:120};
  S.settings.onboarded=true; save(); toast('Demo data loaded - remove it in More → Backup & settings'); viewMonth=cur; setView('home');
}

/* ---------- First-run onboarding ---------- */
function renderOb(){ let o=$('#ob'); if(S.settings.onboarded){ if(o) o.remove(); return; }
  if(!o){ o=document.createElement('div'); o.id='ob'; o.className='ob'; document.body.appendChild(o); }
  const N=4; const dots=`<div class="dots">${[0,1,2,3].map(k=>`<i class="${k===obStep?'on':''}"></i>`).join('')}</div>`;
  const nav=(back,next,label)=>`<div class="btnrow">${back?`<button onclick="obStep--;renderOb()">Back</button>`:''}<button class="primary" onclick="${next}">${label||'Next'}</button></div>`;
  let h='';
  if(obStep===0) h=`<div class="empty"><div class="e">✈️</div><h2>SG Miles Tracker</h2><p>Know which card to use for every purchase, stay inside your 4 mpd caps, and see where your money goes. Everything stays on this phone.</p></div>${nav(false,'obStep=1;renderOb()','Get started')}<button class="link" style="width:100%" onclick="finishOb(true)">Skip and look at demo data</button>`;
  if(obStep===1) h=`<h2>Which cards do you hold?</h2><div class="sub">Untick any you don't carry. You can change this later in More → Cards.</div><div class="card">${S.cards.map(c=>`<label class="tog"><input type="checkbox" ${c.held?'checked':''} onchange="cardById('${c.id}').held=this.checked;save()"> ${esc(c.name)}</label>`).join('')}</div>${nav(true,'obStep=2;renderOb()')}`;
  if(obStep===2){ const st=held().filter(c=>c.cycle==='statement'&&c.id!=='amaze_citi');
    h=`<h2>Statement dates</h2><div class="sub">These cards reset their bonus caps on your statement date, not on the 1st. Check the date on your last statement (or the bank app).</div>
    <div class="card">${st.length?st.map(c=>`<label>${esc(short(c.name))}: statement cycle starts on day<input type="number" min="1" max="28" inputmode="numeric" value="${c.stmtSet?c.stmtDay:''}" placeholder="e.g. 15" onchange="setStmt('${c.id}',this.value)"></label>`).join('<div style="height:10px"></div>'):'<div class="sub">None of your cards use statement months.</div>'}</div>
    <div class="card"><div class="sub">Optional: annual fee months (for waiver reminders)</div>${held().filter(c=>c.id!=='amaze_citi'&&c.id!=='hsbc_revo').map(c=>`<div class="kv"><span>${esc(short(c.name))}</span><select style="width:110px" onchange="cardById('${c.id}').feeMonth=+this.value||undefined;save()"><option value="">–</option>${MONTHS.map((m,k)=>`<option value="${k+1}" ${+c.feeMonth===k+1?'selected':''}>${m}</option>`).join('')}</select></div>`).join('')}</div>${nav(true,'obStep=3;renderOb()')}`; }
  if(obStep===3) h=`<h2>Monthly budgets</h2><div class="sub">Optional. Leave blank for none - you can set them later in Spend.</div><div class="card">${['dining','groceries','shopping','transport','entertainment','travel','others'].map(c=>`<label class="kv"><span>${catIcon(c)} ${esc(catName(c))}</span><input class="bud" type="number" inputmode="decimal" min="0" step="10" placeholder="–" value="${S.settings.budgets[c]||''}" onchange="setBudgetQuiet('${c}',this.value)"></label>`).join('')}</div>
    <h2 style="margin-top:18px">You're set 🎉</h2><div class="btnrow"><button onclick="obStep=2;renderOb()">Back</button><button class="primary" onclick="finishOb(false)">Start tracking</button></div><button class="link" style="width:100%" onclick="finishOb(true)">Start with demo data instead</button>`;
  o.innerHTML=`<div class="inner">${dots}${h}</div>`; }
function setStmt(id,v){ const c=cardById(id); const n=Math.max(1,Math.min(28,+v||1)); c.stmtDay=n; c.stmtSet=!!(+v); save(); }
function setBudgetQuiet(c,v){ v=+v; if(v>0) S.settings.budgets[c]=v; else delete S.settings.budgets[c]; save(); }
function finishOb(demo){ S.settings.onboarded=true; save(); renderOb(); if(demo) loadDemo(); else { setView('home'); } }

document.addEventListener('DOMContentLoaded',()=>{ applyTheme(); const nAdded=applyRecurring(S,today()); save();
  if(nAdded) setTimeout(()=>toast(`🔁 Added ${nAdded} repeating entr${nAdded>1?'ies':'y'} for this month`),300);
  view=S.txs.length||held().length?'home':'home'; setView(view); });
</script></body></html>
